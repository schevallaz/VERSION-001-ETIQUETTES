<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ma tournée">
<title>Ma tournée — STLS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{ --bg:#f5f4ee; --card:#fff; --ink:#1c1c1a; --soft:#6b6a63; --line:#e2e0d6; --accent:#0f6b57; --red:#c0392b; --orange:#e8792e; --green:#1e8e3e; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:16px; line-height:1.4; }
  #app{ max-width:560px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom)); }
  .brand{ font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--soft); text-transform:uppercase; }
  .titre{ font-size:26px; font-weight:800; margin:4px 0 0; }
  .sous{ color:var(--soft); margin:2px 0; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:12px 0; }
  .compteurs{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px; font-weight:600; }
  .compteurs div{ background:#faf9f4; border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .total{ font-size:20px; font-weight:800; }
  .bandeau{ border-radius:12px; padding:12px; margin:12px 0; font-weight:600; }
  .bandeau.warn{ background:#fff3e6; border:1px solid var(--orange); color:#8a4200; }
  .bandeau.err{ background:#fdecea; border:1px solid var(--red); color:var(--red); }
  .bandeau.info{ background:#eef6f3; border:1px solid var(--accent); color:var(--accent); }
  .bandeau button{ margin-top:8px; }
  button.btn{ width:100%; padding:14px; border-radius:12px; border:1px solid var(--accent); background:var(--accent); color:#fff; font-size:16px; font-weight:700; font-family:inherit; }
  button.btn.ghost{ background:#fff; color:var(--accent); }
  .bl{ background:var(--card); border:1px solid var(--line); border-radius:14px; margin:10px 0; overflow:hidden; }
  .bl-h{ display:flex; justify-content:space-between; align-items:center; padding:12px 14px 0; gap:8px; }
  .num{ font-weight:800; color:var(--accent); }
  .etat{ font-size:12px; font-weight:800; padding:4px 8px; border-radius:999px; white-space:nowrap; }
  .etat-a_faire{ background:#efeee8; color:var(--soft); }
  .etat-en_cours{ background:#fff3e6; color:#8a4200; }
  .etat-livre{ background:#e6f5ea; color:var(--green); }
  .etat-echec{ background:#fdecea; color:var(--red); }
  .bl-resume{ padding:6px 14px 12px; cursor:pointer; }
  .bl-resume .dest{ font-size:17px; font-weight:700; }
  .ligne{ color:var(--soft); }
  .detail{ display:none; border-top:1px solid var(--line); padding:12px 14px; background:#fcfbf7; }
  .bl.ouvert .detail{ display:block; }
  .detail h4{ margin:12px 0 4px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); }
  .detail h4:first-child{ margin-top:0; }
  .tel{ display:inline-block; margin:2px 8px 2px 0; padding:10px 14px; border-radius:10px; background:var(--accent); color:#fff; text-decoration:none; font-weight:700; }
  .chip{ display:inline-block; padding:3px 9px; border-radius:999px; background:#e8f3ee; color:var(--accent); font-weight:700; font-size:13px; margin:2px 4px 2px 0; }
  .imperatif{ background:#fdecea; color:var(--red); border-radius:8px; padding:8px 10px; font-weight:800; margin-bottom:8px; }
  .instr{ background:#fff8e1; border:1px solid #f0d78c; border-radius:8px; padding:8px 10px; white-space:pre-wrap; }
  .msg{ text-align:center; padding:48px 12px; }
  .msg h1{ font-size:22px; margin:0 0 8px; }
  .maj{ font-size:12px; color:var(--soft); margin-top:6px; }
  .sync-badge{ display:none; background:#fff3e6; border:1px solid var(--orange); color:#8a4200; border-radius:10px; padding:8px 10px; font-size:13px; font-weight:600; margin:10px 0; }
  .btn.act{ background:var(--accent); border-color:var(--accent); }
  .btn.danger{ background:var(--red); border-color:var(--red); color:#fff; }
  .btn-row{ display:flex; gap:8px; margin-top:8px; }
  .btn-row .btn{ flex:1; }
  .btn-row-sep{ height:6px; }
  .etape-fait{ color:var(--green); font-weight:700; font-size:13.5px; margin:8px 0 4px; }
  .etape-ok{ background:#e6f5ea; color:var(--green); border-radius:10px; padding:10px; font-weight:800; text-align:center; }
  .etape-echec{ background:#fdecea; color:var(--red); border-radius:10px; padding:10px; font-weight:800; text-align:center; }
  .lbl{ font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--soft); font-weight:700; margin:10px 0 6px; }
  .champ{ width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; font-size:15px; font-family:inherit; margin-bottom:8px; }
  .bloc-photos, .bloc-signature, .bloc-reserves, .bloc-echec, .recap{ margin-top:10px; }
  .vignettes{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .sigcanvas{ width:100%; height:180px; border:1px solid var(--line); border-radius:10px; background:#fcfcfa; touch-action:none; display:block; margin-bottom:8px; }
  .recap{ background:#faf9f4; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:14px; }
  .recap > div{ padding:2px 0; }
</style>
</head>
<body>
<div id="app"><div class="msg"><h1>Chargement…</h1></div></div>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script>
// ================= Application livreur (PWA) — étape 1 : accès sécurisé à la tournée et affichage des BL =================
var firebaseConfig = {
  apiKey: "AIzaSyDEOdOoZyWmKZyDDe6c83TBBiMQUF5z1Qk",
  authDomain: "gestion-depot-de9a4.firebaseapp.com",
  projectId: "gestion-depot-de9a4",
  storageBucket: "gestion-depot-de9a4.firebasestorage.app",
  messagingSenderId: "521206560933",
  appId: "1:521206560933:web:22bead871abbd50d19354c"
};
var LS_TOKEN = 'stls_livreur_token';
var db = null, token = '', chargementEnCours = false, ouvertureEnregistree = false;
var S = { lien: null, tournee: null, bls: [], events: [], hors: false, majLe: '' };
var JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];

function ls(k, v){
  try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){ return null; }
}
function esc(s){ return String(s==null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function fmtDate(iso){ var p = String(iso||'').slice(0,10).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : ''; }
function fmtDateLong(iso){
  var d = new Date(String(iso||'').slice(0,10)+'T00:00:00');
  return isNaN(d.getTime()) ? fmtDate(iso) : JOURS[d.getDay()]+' '+fmtDate(iso);
}
function deviceId(){
  var id = ls('stls_livreur_device');
  if(!id){ id = 'dv_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); ls('stls_livreur_device', id); }
  return id;
}
function telHref(t){ return 'tel:'+String(t).replace(/[^\d+]/g,''); }

// le jeton est dans le # de l'adresse : on le mémorise puis on le retire de la barre d'adresse
function lireToken(){
  var m = /[#&]t=([A-Za-z0-9_-]{16,})/.exec(location.hash || '');
  if(m){
    ls(LS_TOKEN, m[1]);
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
    return m[1];
  }
  return ls(LS_TOKEN) || '';
}
function verifierLien(lien){
  if(lien.actif === false) return { t: 'Lien désactivé', m: 'Ce lien a été désactivé par l\'exploitation. Demande un nouveau lien.' };
  if(lien.expireLe && new Date(lien.expireLe) < new Date()) return { t: 'Lien expiré', m: 'Ce lien a expiré. Demande un nouveau lien à l\'exploitation.' };
  return null;
}
function afficherMessage(titre, texte, retry){
  document.getElementById('app').innerHTML = '<div class="msg"><h1>'+esc(titre)+'</h1><p class="sous">'+esc(texte)+'</p>'+
    (retry ? '<p><button class="btn" id="btnRetry">Réessayer</button></p>' : '')+'</div>';
  if(retry) document.getElementById('btnRetry').addEventListener('click', charger);
}

// ---------- cache local : la tournée reste consultable sans réseau ----------
function cleCache(){ return 'stls_livreur_cache_'+token; }
function sauverCache(){ ls(cleCache(), JSON.stringify({ lien: S.lien, tournee: S.tournee, bls: S.bls, events: S.events, majLe: S.majLe })); }
function lireCache(){ try{ var c = JSON.parse(ls(cleCache())||'null'); return c && c.tournee ? c : null; }catch(e){ return null; } }

// ---------- état d'un BL, déduit des événements ----------
var EVT_ETAT = { arrivee: 'en_cours', prise_en_charge: 'en_cours', arrivee_client: 'en_cours', livraison_validee: 'livre', echec_confirme: 'echec' };
var ETAT_LABEL = { a_faire: 'À FAIRE', en_cours: 'EN COURS', livre: 'LIVRÉ', echec: 'ÉCHEC DE LIVRAISON' };
function etatBL(num){
  var evs = S.events.filter(function(e){ return e.bl===num && EVT_ETAT[e.type]; })
    .sort(function(a,b){ return (a.dateHeureAppareil||'').localeCompare(b.dateHeureAppareil||''); });
  return evs.length ? EVT_ETAT[evs[evs.length-1].type] : 'a_faire';
}

// ---------- chargement ----------
async function charger(){
  if(chargementEnCours) return;
  chargementEnCours = true;
  try{
    var ref = db.collection('stls_livreur').doc(token);
    var l = await ref.get();
    if(!l.exists){ ls(cleCache(), null); afficherMessage('Lien invalide', 'Ce lien n\'existe pas. Demande un nouveau lien à l\'exploitation.'); return; }
    var lien = l.data(), refus = verifierLien(lien);
    if(refus){ afficherMessage(refus.t, refus.m); return; }
    var t = await ref.collection('tournee').doc('main').get();
    var b = await ref.collection('bl').get();
    var e = await ref.collection('evenements').get();
    var bls = [], events = [];
    b.forEach(function(d){ bls.push(d.data()); });
    e.forEach(function(d){ events.push(d.data()); });
    bls.sort(function(x,y){ return (x.ordre||0)-(y.ordre||0); });
    S = { lien: lien, tournee: t.exists ? t.data() : null, bls: bls, events: events, hors: false, majLe: new Date().toISOString() };
    if(!S.tournee){ afficherMessage('Tournée non publiée', 'La tournée n\'est pas encore disponible. Réessaie dans un instant.', true); return; }
    sauverCache();
    enregistrerOuverture();
    render();
  }catch(err){
    var c = lireCache();
    if(c && !verifierLien(c.lien || {})){ S = { lien: c.lien, tournee: c.tournee, bls: c.bls, events: c.events, hors: true, majLe: c.majLe }; render(); }
    else if(c){ var r = verifierLien(c.lien || {}); afficherMessage(r.t, r.m); }
    else afficherMessage('Connexion impossible', 'Impossible de charger ta tournée pour le moment. Vérifie ta connexion puis réessaie.', true);
  }finally{ chargementEnCours = false; }
}

// ---------- événements écrits par le livreur (jamais modifiés ni supprimés) ----------
async function ecrireEvenement(id, data){
  try{ await db.collection('stls_livreur').doc(token).collection('evenements').doc(id).set(Object.assign({ id: id, deviceId: deviceId(), dateHeureAppareil: new Date().toISOString() }, data)); return true; }
  catch(e){ return false; }
}
function enregistrerOuverture(){
  if(ouvertureEnregistree) return;
  ouvertureEnregistree = true;
  ecrireEvenement('open_'+deviceId()+'_'+Date.now(), { type: 'lien_ouvert', version: S.tournee.version||1, appareil: (navigator.userAgent||'').slice(0,120) });
}

// ---------- tournée modifiée après l'envoi ----------
function cleVue(){ return 'stls_livreur_seen_'+token; }
function versionVue(){ var v = ls(cleVue()); return v==null ? null : parseInt(v,10); }
function modifsNonVues(){
  var vu = versionVue(), v = S.tournee.version||1;
  if(vu===null){ ls(cleVue(), String(v)); return []; }          // première ouverture : rien à signaler
  if(v <= vu) return [];
  return (S.tournee.modifications||[]).filter(function(m){ return m.version > vu; });
}
var LIB_MODIF = { ajout: 'BL ajouté', retrait: 'BL retiré', modification: 'BL modifié', envoi: 'Tournée envoyée' };
async function acquitter(){
  var v = S.tournee.version||1;
  ls(cleVue(), String(v));
  ecrireEvenement('ack_'+v+'_'+deviceId(), { type: 'acquittement_modification', version: v });
  render();
}

// ---------- affichage ----------
function compteurs(){
  var c = { a_faire: 0, en_cours: 0, livre: 0, echec: 0 };
  S.bls.forEach(function(b){ c[etatBL(b.numero)]++; });
  return c;
}
function blHtml(b){
  var etat = etatBL(b.numero), ct = b.contraintes || {};
  var adr = [b.adresse1, b.adresse2].filter(Boolean).join(', ');
  var tels = [b.tel1, b.tel2].filter(Boolean).map(function(t){ return '<a class="tel" href="'+esc(telHref(t))+'">📞 '+esc(t)+'</a>'; }).join('');
  var cons = [];
  if(ct.etage) cons.push('Étage '+esc(ct.etage));
  if(ct.etage || ct.ascenseur) cons.push('Ascenseur '+(ct.ascenseur ? 'oui' : 'non'));
  if(ct.accesDifficile) cons.push('<strong>Accès difficile</strong>');
  if(ct.contactSurPlace) cons.push('Contact sur place : '+esc(ct.contactSurPlace));
  var presta = []; if(b.montage) presta.push('Montage'); if(b.reprise) presta.push('Reprise');
  var d = '';
  if(b.estImperative) d += '<div class="imperatif">🔴 LIVRAISON IMPÉRATIVE'+(b.dateImperative ? ' — '+esc(fmtDateLong(b.dateImperative)) : '')+'</div>';
  d += '<h4>Adresse</h4><div>'+esc(adr || '—')+'<br>'+esc([b.cp, b.ville].filter(Boolean).join(' '))+'</div>';
  d += '<h4>Contact</h4><div>'+(tels || '<span class="ligne">Téléphone non renseigné</span>')+'</div>';
  d += '<h4>Marchandise</h4><div>'+esc(b.colis||0)+' colis · '+esc((b.poids||0))+' kg'+(b.volume ? ' · '+esc(b.volume) : '')+(b.nature ? '<br>'+esc(b.nature) : '')+'</div>';
  if(presta.length) d += '<div style="margin-top:6px;">'+presta.map(function(p){ return '<span class="chip">'+esc(p)+'</span>'; }).join('')+'</div>';
  d += '<h4>Accès</h4><div>'+(cons.length ? cons.join(' · ') : '<span class="ligne">Non renseigné</span>')+'</div>';
  if(b.instructions) d += '<h4>Instructions / observations</h4><div class="instr">'+esc(b.instructions)+'</div>';
  d += '<h4>Client</h4><div>'+esc(b.client||'—')+'</div>';
  var cmd = (b.commandes||[]).filter(function(c){ return c.labelNumber; });
  if(cmd.length) d += '<h4>À enlever au dépôt</h4><div>'+cmd.map(function(c){ return esc(c.labelNumber)+' · '+esc(c.colis||0)+' colis'+(c.emplacement ? ' · 📍 '+esc(c.emplacement) : ''); }).join('<br>')+'</div>';
  d += '<h4>Suivi de la livraison</h4>'+panneauHtml(b);
  return '<div class="bl" data-n="'+esc(b.numero)+'">'+
    '<div class="bl-h"><span class="num">BL '+esc(b.numero)+'</span><span class="etat etat-'+etat+'">'+ETAT_LABEL[etat]+'</span></div>'+
    '<div class="bl-resume">'+(b.estImperative ? '<div style="color:var(--red);font-weight:800;font-size:13px;">🔴 IMPÉRATIF'+(b.dateImperative ? ' — '+esc(fmtDate(b.dateImperative)) : '')+'</div>' : '')+'<div class="dest">'+esc(b.ordre)+'. '+esc(b.destinataire||'—')+'</div>'+
    '<div class="ligne">'+esc([b.cp, b.ville].filter(Boolean).join(' '))+'</div>'+
    '<div class="ligne">'+esc(b.creneau ? '🕒 '+b.creneau+' · ' : '')+esc(b.colis||0)+' colis · '+esc(b.poids||0)+' kg</div></div>'+
    '<div class="detail">'+d+'</div></div>';
}
function render(){
  var t = S.tournee, c = compteurs(), n = S.bls.length;
  var modifs = modifsNonVues();
  var h = '<div class="brand">STLS · Ma tournée</div>'+
    '<div class="titre">TOURNÉE '+esc(t.tourneeId)+'</div>'+
    '<div class="sous">'+esc(fmtDateLong(t.date))+(t.referentiel && t.referentiel.heureDebut ? ' · '+esc(t.referentiel.heureDebut)+'–'+esc(t.referentiel.heureFin) : '')+'</div>'+
    '<div class="sous">Livreur : <strong>'+esc(t.livreurNom||'—')+'</strong>'+(t.vehicule ? ' · '+esc(t.vehicule) : '')+'</div>';
  if(S.hors) h += '<div class="bandeau warn">Hors connexion — données du '+esc(S.majLe ? fmtDate(S.majLe)+' '+new Date(S.majLe).toTimeString().slice(0,5) : '?')+'. Elles se mettront à jour au retour du réseau.</div>';
  h += '<div class="sync-badge" id="syncBadge"></div>';
  if(t.statut==='annulee') h += '<div class="bandeau err">Cette tournée a été annulée par l\'exploitation.</div>';
  if(modifs.length){
    h += '<div class="bandeau warn">⚠ Ta tournée a été modifiée<br>'+modifs.map(function(m){ return '• '+esc(LIB_MODIF[m.type]||m.type)+(m.bl ? ' : '+esc(m.bl) : ''); }).join('<br>')+
      '<br><button class="btn" id="btnAck">J\'ai pris connaissance</button></div>';
  }
  h += '<div class="card"><div class="total">'+n+' LIVRAISON'+(n>1?'S':'')+'</div><div class="compteurs">'+
    '<div>🟢 '+c.livre+' réalisée'+(c.livre>1?'s':'')+'</div><div>🟠 '+c.en_cours+' en cours</div>'+
    '<div>🔴 '+c.echec+' en échec</div><div>⚪ '+c.a_faire+' restante'+(c.a_faire>1?'s':'')+'</div></div>'+
    '<div class="maj">Mis à jour à '+esc(S.majLe ? new Date(S.majLe).toTimeString().slice(0,5) : '')+'</div></div>';
  h += S.bls.map(blHtml).join('') || '<div class="card">Aucun BL dans cette tournée.</div>';
  document.getElementById('app').innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll('.bl-resume'), function(el){
    el.addEventListener('click', function(){ el.parentNode.classList.toggle('ouvert'); });
  });
  var ack = document.getElementById('btnAck');
  if(ack) ack.addEventListener('click', acquitter);
  majBadgeSync();
}

// ---------- veille : lien désactivé, tournée modifiée, retour du réseau ----------
function demarrerVeille(){
  var ref = db.collection('stls_livreur').doc(token);
  try{
    ref.onSnapshot(function(s){
      if(!s.exists || !S.lien) return;
      var lien = s.data(), refus = verifierLien(lien);
      if(refus){ afficherMessage(refus.t, refus.m); return; }
      if(lien.version !== S.lien.version) charger();
    }, function(){});
    ref.collection('tournee').doc('main').onSnapshot(function(s){
      if(s.exists && S.tournee && s.data().version !== S.tournee.version) charger();
    }, function(){});
  }catch(e){}
  window.addEventListener('online', function(){ if(S.hors) charger(); });
}

// ================= Étape 2 : exécution du BL (arrivée, photos, prise en charge, livraison, signatures, validation, échec) =================
var echecOuvert = {};
var echecBrouillon = {}; // motif/commentaire/contacté en cours de saisie, conservés le temps que la photo justificative s'ajoute
var MOTIFS_ECHEC = ['Client absent','Client injoignable','Adresse introuvable','Accès impossible','Accès bloqué','Marchandise refusée','Marchandise endommagée','Client demande un report','Problème véhicule','Problème de sécurité',"Temps d'attente trop important",'Autre'];

function idGen(prefix){ return prefix+'_'+deviceId()+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6); }
function bonEvents(numero){ return S.events.filter(function(e){ return e.bl===numero; }); }
function hasEv(numero, type){ return bonEvents(numero).some(function(e){ return e.type===type; }); }
function countEv(numero, type){ return bonEvents(numero).filter(function(e){ return e.type===type; }).length; }
function derniereObs(numero, type){ var evs = bonEvents(numero).filter(function(e){ return e.type===type; }); return evs.length ? evs[evs.length-1] : null; }

// la position est toujours relevée à l'instant précis de l'action (maximumAge:0) — jamais la dernière position connue.
// une position indisponible n'empêche jamais l'action : on enregistre "GPS indisponible" et on continue.
function relevePosition(){
  return new Promise(function(resolve){
    if(!navigator.geolocation){ resolve({ indisponible:true, motif:'non supporté' }); return; }
    var fini = false;
    var timer = setTimeout(function(){ if(!fini){ fini=true; resolve({ indisponible:true, motif:'délai dépassé' }); } }, 12000);
    navigator.geolocation.getCurrentPosition(function(pos){
      if(fini) return; fini=true; clearTimeout(timer);
      resolve({ indisponible:false, latitude:pos.coords.latitude, longitude:pos.coords.longitude, precision:pos.coords.accuracy });
    }, function(err){
      if(fini) return; fini=true; clearTimeout(timer);
      resolve({ indisponible:true, motif: err.message||'refusé' });
    }, { enableHighAccuracy:true, timeout:11000, maximumAge:0 });
  });
}
function gpsLigne(pos){
  if(!pos) return '';
  if(pos.gpsIndisponible || pos.indisponible) return '📍 GPS indisponible';
  var p = (pos.precision!=null) ? ' (±'+Math.round(pos.precision)+'m)' : '';
  return '📍 '+pos.latitude.toFixed(5)+', '+pos.longitude.toFixed(5)+p;
}

function compresserImage(file, maxDim, qualite){
  return new Promise(function(resolve){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxDim/Math.max(img.width, img.height));
        var w = Math.round(img.width*scale)||1, h = Math.round(img.height*scale)||1;
        var canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', qualite));
      };
      img.onerror = function(){ resolve(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ resolve(null); };
    reader.readAsDataURL(file);
  });
}

// ---------- file d'attente hors connexion : chaque entrée est un événement complet, avec sa photo/signature en base64 ----------
function clePending(){ return 'stls_livreur_pending_'+token; }
function listePending(){ try{ return JSON.parse(ls(clePending())||'[]'); }catch(e){ return []; } }
function sauverPending(list){ ls(clePending(), JSON.stringify(list)); }
function ajouterPending(entry){ var l=listePending(); l.push(entry); sauverPending(l); }
function retirerPending(id){ sauverPending(listePending().filter(function(x){ return x.id!==id; })); }
function nbPending(){ return listePending().length; }

async function envoyerEvenement(entry){
  try{
    var data = Object.assign({}, entry.data);
    if(entry.photoBase64){
      var blob = await (await fetch(entry.photoBase64)).blob();
      var path = 'stls_livreur/'+token+'/preuves/'+entry.id+'.jpg';
      await firebase.storage().ref(path).put(blob, { contentType:'image/jpeg' });
      data.photoPath = path;
    }
    if(entry.signatureBase64){
      var blob2 = await (await fetch(entry.signatureBase64)).blob();
      var path2 = 'stls_livreur/'+token+'/signatures/'+entry.id+'.png';
      await firebase.storage().ref(path2).put(blob2, { contentType:'image/png' });
      data.signaturePath = path2;
    }
    await db.collection('stls_livreur').doc(token).collection('evenements').doc(entry.id)
      .set(Object.assign({ id:entry.id, deviceId:deviceId(), dateHeureAppareil:entry.dateHeureAppareil }, data));
    return true;
  }catch(e){ console.error('envoyerEvenement error', e); return false; }
}

var syncEnCours = false;
async function tenterSyncPending(){
  if(syncEnCours) return;
  syncEnCours = true;
  majBadgeSync();
  var list = listePending();
  for(var i=0;i<list.length;i++){
    var ok = await envoyerEvenement(list[i]);
    if(ok) retirerPending(list[i].id); else break; // on garde l'ordre chronologique, on s'arrête à la première qui échoue encore
  }
  syncEnCours = false;
  majBadgeSync();
}
window.addEventListener('online', tenterSyncPending);
setInterval(tenterSyncPending, 25000);

function majBadgeSync(){
  var el = document.getElementById('syncBadge');
  if(!el) return;
  var n = nbPending();
  if(syncEnCours){ el.textContent = '🟠 Synchronisation en cours…'; el.style.display = 'block'; }
  else if(n){ el.textContent = '🟠 En attente de synchronisation ('+n+')'; el.style.display = 'block'; }
  else { el.style.display = 'none'; }
}

// enregistre un événement : GPS relevé à l'instant, envoi immédiat si en ligne, sinon mis en file — jamais perdu, jamais bloquant
async function enregistrerEvenement(bl, type, extra, photoBase64, signatureBase64){
  var id = idGen(type);
  var pos = await relevePosition();
  var data = Object.assign({ type:type, bl:bl }, extra||{}, {
    latitude: pos.indisponible ? null : pos.latitude,
    longitude: pos.indisponible ? null : pos.longitude,
    precision: pos.indisponible ? null : pos.precision,
    gpsIndisponible: !!pos.indisponible
  });
  var dateHeureAppareil = new Date().toISOString();
  var entry = { id:id, data:data, dateHeureAppareil:dateHeureAppareil, photoBase64:photoBase64||null, signatureBase64:signatureBase64||null };
  var enLigne = navigator.onLine !== false;
  var ok = enLigne ? await envoyerEvenement(entry) : false;
  S.events.push(Object.assign({ id:id, deviceId:deviceId(), dateHeureAppareil:dateHeureAppareil, _enAttente:!ok }, data));
  if(!ok) ajouterPending(entry);
  sauverCache();
  majBadgeSync();
  return { id:id, gps:data };
}

// ---------- signature tactile ----------
function initSignaturePad(canvas){
  var ctx = canvas.getContext('2d');
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.strokeStyle = '#1c1c1a';
  var drawing = false, last = null;
  canvas._vide = true;
  function pos(e){
    var r = canvas.getBoundingClientRect();
    var t = e.touches && e.touches.length ? e.touches[0] : e;
    return { x:(t.clientX-r.left)*(canvas.width/r.width), y:(t.clientY-r.top)*(canvas.height/r.height) };
  }
  function start(e){ e.preventDefault(); drawing = true; canvas._vide = false; last = pos(e); }
  function move(e){ if(!drawing) return; e.preventDefault(); var p = pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last = p; }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive:false }); canvas.addEventListener('touchmove', move, { passive:false }); canvas.addEventListener('touchend', end);
}
function effacerCanvas(canvas){ canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height); canvas._vide = true; }

// ---------- étape courante d'un BL, déduite des événements déjà enregistrés ----------
// nom de l'étape = ce qu'elle affiche (jamais ce qui vient d'être fait). Elle ne progresse que sur les jalons
// (arrivée, prise en charge, signatures...), jamais sur le seul fait d'avoir pris une photo : on peut en
// prendre plusieurs sans quitter l'étape en cours. Les photos de livraison sont l'exception volontaire :
// au moins une est exigée avant de pouvoir passer à la signature du client.
function etapeBL(numero){
  if(hasEv(numero,'livraison_validee')) return 'validee';
  if(hasEv(numero,'echec_confirme')) return 'echec';
  if(hasEv(numero,'signature_livreur')) return 'reserves_recap';          // les deux signatures sont faites
  if(hasEv(numero,'signature_client')) return 'a_signer_livreur';        // reste à signer : le livreur
  if(hasEv(numero,'photo_livraison')) return 'a_signer_client';          // reste à signer : le client
  if(hasEv(numero,'arrivee_client')) return 'chez_le_client';
  if(hasEv(numero,'prise_en_charge')) return 'en_route';
  if(hasEv(numero,'arrivee')) return 'enlevement';
  return 'depart';
}

// ---------- panneau d'action : une fonction par étape, rejouée après chaque action pour rester à jour ----------

    var eve = derniereObs(numero,'echec_confirme');
    return '<div class="etape-echec">🔴 Échec de livraison'+(eve&&eve.motif?' — '+esc(eve.motif):'')+'</div>';
  }
  var html = '<div id="pan-'+numero+'">';
  if(etape==='depart'){
    html += '<button class="btn act" data-act="arrivee" data-bl="'+numero+'">📍 JE SUIS ARRIVÉ</button>';
  } else if(etape==='enlevement'){
    html += '<div class="etape-fait">📍 Arrivée enregistrée</div>';
    html += photosSectionHtml(numero, 'photo_enlevement', '📷 PHOTOS À L\'ENLÈVEMENT');
    html += '<button class="btn act" data-act="prise_en_charge" data-bl="'+numero+'">📦 MARCHANDISE PRISE EN CHARGE</button>';
  } else if(etape==='en_route'){
    html += '<div class="etape-fait">📦 Marchandise prise en charge · '+countEv(numero,'photo_enlevement')+' photo(s)</div>';
    html += '<button class="btn act" data-act="arrivee_client" data-bl="'+numero+'">📍 ARRIVÉE CHEZ LE CLIENT</button>';
  } else if(etape==='chez_le_client'){
    html += '<div class="etape-fait">📍 Arrivé chez le client</div>';
    html += photosSectionHtml(numero, 'photo_livraison', '📷 PHOTOS DE LA MARCHANDISE LIVRÉE');
    html += '<div class="lbl" style="color:var(--orange);">Prends au moins une photo — la signature s\'ouvrira ensuite</div>';
  } else if(etape==='a_signer_client'){
    html += '<div class="etape-fait">📷 '+countEv(numero,'photo_livraison')+' photo(s) de livraison</div>';
    html += signaturePanelHtml(numero, 'client', 'SIGNATURE DU CLIENT', true);
  } else if(etape==='a_signer_livreur'){
    html += '<div class="etape-fait">✍️ Signature client enregistrée</div>';
    html += signaturePanelHtml(numero, 'livreur', 'SIGNATURE DU LIVREUR', false);
  } else if(etape==='reserves_recap'){
    html += '<div class="etape-fait">✍️ Signature livreur enregistrée</div>';
    html += reservesEtRecapHtml(numero);
  }
  if(['depart'].indexOf(etape)<0){
    html += '<div class="btn-row-sep"></div><button class="btn ghost" data-act="ouvrir_echec" data-bl="'+numero+'">❌ LIVRAISON IMPOSSIBLE</button>';
  } else {
    html += '<button class="btn ghost" data-act="ouvrir_echec" data-bl="'+numero+'" style="margin-top:8px;">❌ LIVRAISON IMPOSSIBLE</button>';
  }
  html += '<div id="echec-'+numero+'" style="display:'+(echecOuvert[numero]?'block':'none')+';">'+(echecOuvert[numero]?echecFormHtml(numero):'')+'</div>';
  html += '</div>';
  return html;
}

// ---------- wiring : délégation d'événements sur toute la zone BL ouverte ----------
document.getElementById('app').addEventListener('click', async function(ev){
  var btn = ev.target.closest('[data-act]');
  if(!btn) return;
  var act = btn.getAttribute('data-act'), numero = btn.getAttribute('data-bl');
  if(!act) return;

  if(act==='arrivee'){
    btn.disabled = true; btn.textContent = 'Relevé GPS en cours…';
    await enregistrerEvenement(numero, 'arrivee', {});
    render(); reouvrirDetail(numero);
  }
  else if(act==='prise_en_charge'){
    btn.disabled = true;
    await enregistrerEvenement(numero, 'prise_en_charge', {});
    render(); reouvrirDetail(numero);
  }
  else if(act==='arrivee_client'){
    btn.disabled = true;
    await enregistrerEvenement(numero, 'arrivee_client', {});
    render(); reouvrirDetail(numero);
  }
  else if(act==='continuer_signature'){
    render(); reouvrirDetail(numero);
  }
  else if(act==='prendre_photo'){
    var type = btn.getAttribute('data-type');
    document.querySelector('.photo-input[data-bl="'+numero+'"][data-type="'+type+'"]').click();
  }
  else if(act==='effacer_signature'){
    var c = document.getElementById('sig-'+numero+'-'+btn.getAttribute('data-qui'));
    if(c) effacerCanvas(c);
  }
  else if(act==='valider_signature'){
    var qui = btn.getAttribute('data-qui');
    var canvas = document.getElementById('sig-'+numero+'-'+qui);
    if(!canvas || canvas._vide){ alert('Signature vide — fais signer avant de valider.'); return; }
    if(qui==='client'){
      var nomEl = document.getElementById('signataire-'+numero);
      var nom = nomEl ? nomEl.value.trim() : '';
      if(!nom){ alert('Indique le nom du signataire'); return; }
      btn.disabled = true;
      await enregistrerEvenement(numero, 'signature_client', { signataire: nom }, null, canvas.toDataURL('image/png'));
    } else {
      btn.disabled = true;
      await enregistrerEvenement(numero, 'signature_livreur', {}, null, canvas.toDataURL('image/png'));
    }
    render(); reouvrirDetail(numero);
  }
  else if(act==='reserves'){
    var val = btn.getAttribute('data-val');
    if(val==='non'){
      await enregistrerEvenement(numero, 'reserves', { aReserves:false });
      render(); reouvrirDetail(numero);
    } else {
      var desc = prompt('Décris la réserve :');
      if(desc===null) return;
      desc = desc.trim();
      if(!desc){ alert('Une description est obligatoire pour une réserve'); return; }
      await enregistrerEvenement(numero, 'reserves', { aReserves:true, description:desc });
      render(); reouvrirDetail(numero);
    }
  }
  else if(act==='valider_livraison'){
    btn.disabled = true; btn.textContent = 'Validation…';
    await enregistrerEvenement(numero, 'livraison_validee', {});
    render(); reouvrirDetail(numero);
  }
  else if(act==='ouvrir_echec'){
    echecOuvert[numero] = true;
    var zone = document.getElementById('echec-'+numero);
    zone.innerHTML = echecFormHtml(numero);
    zone.style.display = 'block';
  }
  else if(act==='annuler_echec'){
    echecOuvert[numero] = false;
    delete echecBrouillon[numero];
    document.getElementById('echec-'+numero).style.display = 'none';
  }
  else if(act==='confirmer_echec'){
    var motif = document.getElementById('motif-'+numero).value;
    var commentaire = document.getElementById('commentaire-'+numero).value.trim();
    if(motif==='Autre' && !commentaire){ alert('Un commentaire est obligatoire pour le motif "Autre"'); return; }
    var contacte = document.getElementById('contacte-'+numero).checked;
    btn.disabled = true; btn.textContent = 'Confirmation…';
    echecOuvert[numero] = false;
    delete echecBrouillon[numero];
    await enregistrerEvenement(numero, 'echec_confirme', { motif:motif, commentaire:commentaire, clientContacte:contacte });
    render(); reouvrirDetail(numero);
  }
});

// prise de photo : compression puis événement (avec file d'attente hors connexion automatique)
document.getElementById('app').addEventListener('change', async function(ev){
  var input = ev.target;
  if(!input.classList || !input.classList.contains('photo-input')) return;
  var file = input.files && input.files[0];
  if(!file) return;
  var numero = input.getAttribute('data-bl'), type = input.getAttribute('data-type');
  if(echecOuvert[numero]){
    var mEl=document.getElementById('motif-'+numero), cEl=document.getElementById('commentaire-'+numero), xEl=document.getElementById('contacte-'+numero);
    echecBrouillon[numero] = { motif: mEl?mEl.value:'', commentaire: cEl?cEl.value:'', contacte: xEl?xEl.checked:false };
  }
  input.disabled = true;
  var base64 = await compresserImage(file, 1280, 0.7);
  if(!base64){ input.disabled = false; alert('Photo illisible, réessaie'); return; }
  await enregistrerEvenement(numero, type, {});
  // remplace le dernier événement de ce type par sa version avec photo (le précédent appel a créé un id neuf : on refait proprement)
  var derniers = S.events.filter(function(e){ return e.bl===numero && e.type===type; });
  var dernier = derniers[derniers.length-1];
  S.events = S.events.filter(function(e){ return e.id!==dernier.id; });
  await enregistrerEvenementPhoto(numero, type, dernier, base64);
  input.value = '';
  render(); reouvrirDetail(numero);
});
async function enregistrerEvenementPhoto(numero, type, evGps, photoBase64){
  var id = evGps.id; // conserve le même horodatage/GPS déjà relevé
  var data = { type:type, bl:numero, latitude:evGps.latitude, longitude:evGps.longitude, precision:evGps.precision, gpsIndisponible:evGps.gpsIndisponible };
  var entry = { id:id, data:data, dateHeureAppareil:evGps.dateHeureAppareil, photoBase64:photoBase64, signatureBase64:null };
  var ok = navigator.onLine!==false ? await envoyerEvenement(entry) : false;
  S.events.push(Object.assign({ id:id, deviceId:deviceId(), dateHeureAppareil:evGps.dateHeureAppareil, _enAttente:!ok }, data));
  if(!ok) ajouterPending(entry);
  sauverCache(); majBadgeSync();
}

// ré-ouvre le détail du BL après un rendu complet (le rendu recrée le DOM, qui se referme sinon)
function reouvrirDetail(numero){
  var el = document.querySelector('.bl[data-n="'+numero+'"]');
  if(el){ el.classList.add('ouvert'); Array.prototype.forEach.call(el.querySelectorAll('.sigcanvas'), function(c){ initSignaturePad(c); }); el.scrollIntoView({ behavior:'smooth', block:'start' }); }
}

async function demarrer(){
  token = lireToken();
  if(!token){ afficherMessage('Lien absent', 'Ouvre le lien reçu par WhatsApp pour accéder à ta tournée.'); return; }
  try{ firebase.initializeApp(firebaseConfig); db = firebase.firestore(); }
  catch(e){
    var c = lireCache();
    if(c){ S = { lien: c.lien, tournee: c.tournee, bls: c.bls, events: c.events, hors: true, majLe: c.majLe }; render(); }
    else afficherMessage('Service indisponible', 'Impossible de démarrer l\'application. Vérifie ta connexion.', true);
    return;
  }
  await charger();
  demarrerVeille();
}
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
