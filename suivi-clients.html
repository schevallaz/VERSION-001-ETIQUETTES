<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Suivi clients – STLS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECEF; --surface:#FFFFFF; --surface-2:#F4F6F8; --line:#CDD3D9;
  --ink:#18212C; --ink-2:#4F5B67; --ink-3:#7B8692;
  --ochre:#D9971C; --ochre-soft:#FBEFD6; --ochre-ink:#7A4E00;
  --olive:#4E6B2F; --olive-soft:#E3ECD8;
  --danger:#B3261E; --focus:#2F6FD6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161C; --surface:#1A2129; --surface-2:#222A33; --line:#323C47;
    --ink:#E8ECF0; --ink-2:#A9B3BD; --ink-3:#7E8994;
    --ochre:#EBB043; --ochre-soft:#3A2E16; --ochre-ink:#F3C978;
    --olive:#9CC06F; --olive-soft:#26321B;
    --danger:#F2867E; --focus:#7FA9F0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#1A2129; --surface-2:#222A33; --line:#323C47;
  --ink:#E8ECF0; --ink-2:#A9B3BD; --ink-3:#7E8994;
  --ochre:#EBB043; --ochre-soft:#3A2E16; --ochre-ink:#F3C978;
  --olive:#9CC06F; --olive-soft:#26321B;
  --danger:#F2867E; --focus:#7FA9F0;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:320px 1fr;height:100%}

/* ---- Liste ---- */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:20px 18px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.brand h1{font-size:22px}
.brand small{color:var(--ink-3);font-size:13px}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);
  background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--danger)}
.new{width:100%;margin-top:10px}
.list{list-style:none;margin:0;padding:6px 0;overflow-y:auto;flex:1}
.list button{all:unset;box-sizing:border-box;display:block;width:100%;padding:12px 18px;cursor:pointer;border-left:3px solid transparent}
.list button:hover{background:var(--surface-2)}
.list button[aria-current="true"]{background:var(--surface-2);border-left-color:var(--ochre)}
.list button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.li-name{font-weight:600}
.li-meta{font-size:13px;color:var(--ink-2)}
.li-step{font-size:12px;color:var(--ink-3);margin-top:2px}
.empty-list{padding:24px 18px;color:var(--ink-3);font-size:14px}
.store-note{padding:10px 18px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line)}

/* ---- Fiche ---- */
.main{overflow-y:auto;min-height:0}
.sheet{max-width:960px;margin:0 auto;padding:28px 28px 60px}
.back{display:none;margin-bottom:12px}
.top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:22px}
.name-input{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:34px;font-weight:700;
  border:none;background:transparent;padding:0;width:100%;min-width:0;border-bottom:2px solid transparent}
.name-input:hover{border-bottom-color:var(--line)}
.name-input:focus{outline:none;border-bottom-color:var(--ochre)}
.top-left{flex:1 1 320px;min-width:0}
.quick{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px;color:var(--ink-2);font-size:14px}
.quick a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid var(--ochre)}
.top-actions{display:flex;gap:8px}

section.block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:18px}
section.block h2{font-size:19px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2)}
.field textarea{resize:vertical;min-height:70px}

/* ---- Parcours : la tournée du projet ---- */
.route-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.paid{font-size:14px;color:var(--ink-2)}
.paid strong{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:22px;color:var(--ink)}
.paybar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);margin:8px 0 22px}
.paybar span{display:block;height:100%}
.paybar .on{background:var(--ochre)}
.route{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));position:relative}
.route::before{content:"";position:absolute;left:5.5%;right:5.5%;top:17px;height:3px;background:var(--line);border-radius:2px}
.route .progress{position:absolute;left:5.5%;top:17px;height:3px;background:var(--olive);border-radius:2px;transition:width .35s ease}
.stop{position:relative;text-align:center;padding:0 3px}
.stop button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;border-radius:8px;padding-bottom:4px}
.stop button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;
  background:var(--surface);border:2px solid var(--line);color:var(--ink-3);position:relative;z-index:1;transition:background .2s,border-color .2s}
.stop.pay .dot{border-color:var(--ochre)}
.stop.done .dot{background:var(--olive);border-color:var(--olive);color:var(--surface)}
.stop.current .dot{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 4px var(--ochre-soft)}
.stop-t{font-size:12.5px;font-weight:600;line-height:1.25}
.stop-s{font-size:11.5px;color:var(--ink-3);line-height:1.25}
.stop.pay .stop-s{color:var(--ochre-ink);font-weight:600}
.stop-d{font-size:11.5px;color:var(--olive);font-weight:600}
.route-hint{font-size:12.5px;color:var(--ink-3);margin-top:14px}

/* ---- Suivi ---- */
.add{display:grid;grid-template-columns:190px 190px 1fr;gap:10px;align-items:end;margin-bottom:6px}
.add .note-wrap{grid-column:1 / -1}
.add-actions{grid-column:1 / -1;display:flex;gap:8px;justify-content:flex-end}
.journal{list-style:none;margin:18px 0 0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.entry{position:relative;padding:4px 0 18px 22px}
.entry::before{content:"";position:absolute;left:-7px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--ochre)}
.entry:first-child::before{background:var(--ochre)}
.entry-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.entry-date{font-weight:600}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.entry-note{margin-top:4px;white-space:pre-wrap;color:var(--ink);max-width:70ch}
.entry-actions{display:flex;gap:2px;margin-left:auto}
.entry-actions .btn{padding:3px 8px;font-size:13px}
.journal-empty{color:var(--ink-3);margin-top:14px}
.editing{background:var(--ochre-soft);border-radius:8px;padding:12px;margin:-4px -8px 12px}

.welcome{display:grid;place-items:center;height:100%;padding:30px;text-align:center;color:var(--ink-2)}
.welcome h2{font-size:26px;color:var(--ink);margin-bottom:8px}
.saved{font-size:12.5px;color:var(--ink-3);min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:900px){
  .route{grid-template-columns:1fr;gap:4px}
  .route::before{left:17px;right:auto;top:18px;bottom:18px;width:3px;height:auto}
  .route .progress{display:none}
  .stop{text-align:left;padding:0}
  .stop button{flex-direction:row;align-items:center;gap:12px;padding:4px 0}
  .stop-txt{display:flex;flex-direction:column}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .app{grid-template-columns:1fr}
  .app.has-sel .side{display:none}
  .app:not(.has-sel) .main{display:none}
  .back{display:inline-flex}
  .sheet{padding:18px 16px 50px}
  .name-input{font-size:28px}
  .grid,.add{grid-template-columns:1fr}
  section.block{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- Connexion ---- */
.login{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);padding:20px;z-index:20}
.login[hidden]{display:none}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
.login-card h1{font-size:26px;margin-bottom:4px}
.login-card p{color:var(--ink-2);margin:0 0 18px}
.login-card .field{margin-bottom:12px}
.login-card .btn.primary{width:100%;margin-top:6px;padding:10px}
.login-err{color:var(--danger);font-size:14px;min-height:1.4em;margin-top:8px}
.linkbtn{all:unset;cursor:pointer;color:var(--ink-2);font-size:13.5px;text-decoration:underline;margin-top:12px;display:inline-block}
.linkbtn:focus-visible{outline:2px solid var(--focus)}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .btn{padding:3px 8px;font-size:12.5px}
/* ---- Envoi par mail ---- */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(640px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,14,20,.45)}
.dlg{padding:22px}
.dlg h2{font-size:21px;margin-bottom:14px}
.dlg .field{margin-bottom:12px}
.dlg textarea{min-height:240px;font-size:13.5px;line-height:1.45}
.dlg-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.dlg-warn{font-size:13px;color:var(--ochre-ink);background:var(--ochre-soft);border-radius:8px;padding:8px 10px;margin-bottom:12px}
.dlg-warn[hidden]{display:none}
.radios{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.radios label{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:14px;margin:0}
/* ---- v2 : sous-blocs, choix, documents ---- */
.side-foot{border-top:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.side-foot .who{padding:0 6px;border:none}
.paramsBtn{justify-content:flex-start}
.paramsBtn[aria-current="true"]{background:var(--surface-2);border-color:var(--ochre)}
h3.sub{font-size:15px;margin:18px 0 10px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;font-family:"Public Sans",system-ui,sans-serif;font-weight:600}
h3.sub:first-child{margin-top:0}
.contact-row{display:grid;grid-template-columns:130px repeat(4,minmax(0,1fr));gap:10px 14px;align-items:end;margin-bottom:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.span-2{grid-column:span 2}
.field .hint{font-size:12px;color:var(--ink-3);margin-top:3px}
.field .bad{font-size:12px;color:var(--danger);margin-top:3px}
.field input.invalid{border-color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.chip-add{border-style:dashed;background:transparent;color:var(--ink-2)}
.chip .x{margin-left:6px;opacity:.6}
.toggle{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer;margin:4px 0 10px}
.toggle input{width:18px;height:18px;accent-color:var(--olive)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:7px 14px;font-size:14px;background:var(--surface-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.money{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:20px;font-weight:700}
.calc{background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.calc small{display:block;color:var(--ink-3);font-size:12.5px}
.btn.small{padding:5px 10px;font-size:13px}

/* Étapes en accordéon */
.steps-acc{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.st{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.st.done{border-color:var(--olive)}
.st-head{display:flex;align-items:center;gap:12px;padding:10px 14px}
.st-head .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid var(--line);flex:none}
.st.done .num{background:var(--olive);border-color:var(--olive);color:var(--surface)}
.st-open{all:unset;cursor:pointer;flex:1;min-width:0}
.st-open:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.st-title{font-weight:600}
.st-sum{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-done{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);flex:none}
.st-done input[type=checkbox]{width:18px;height:18px;accent-color:var(--olive)}
.st-done input[type=date]{padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-size:13px}
.st-body{padding:4px 16px 18px;border-top:1px solid var(--line)}
.chev{transition:transform .2s;color:var(--ink-3)}
.st[data-open="true"] .chev{transform:rotate(90deg)}
.rub{border-left:3px solid var(--ochre);padding-left:12px;margin-bottom:14px}
.rub-t{font-weight:600;margin-bottom:6px}
.cmd{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--surface-2)}
.cmd .field input,.cmd .field textarea,.cmd .field select{background:var(--surface)}
.cmd-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}

/* Documents */
.docs{margin-top:6px}
.docs-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.doc{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 4px;background:var(--surface);max-width:260px}
.doc img{width:40px;height:40px;object-fit:cover;border-radius:5px}
.doc .ico{width:40px;height:40px;display:grid;place-items:center;border-radius:5px;background:var(--surface-2);font-size:11px;font-weight:700;color:var(--danger)}
.doc a{color:var(--ink);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.doc a:hover{text-decoration:underline}
.doc button{all:unset;cursor:pointer;color:var(--ink-3);padding:2px 4px}
.doc button:focus-visible{outline:2px solid var(--focus)}
.up-btns{display:flex;gap:6px;flex-wrap:wrap}
.up-btns label{cursor:pointer}
.up-btns input{display:none}

/* Suivi filtre */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.filters .chip{font-size:13px;padding:3px 10px}

/* Paramètres */
.prow{display:grid;grid-template-columns:200px 1fr auto;gap:10px;align-items:center;margin-bottom:8px}
.prow2{display:grid;grid-template-columns:1fr 120px auto;gap:10px;align-items:center;margin-bottom:8px}
.prow input,.prow2 input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2)}
.pct-row{display:flex;gap:14px;flex-wrap:wrap}
.pct-row .field{width:160px}
.sum-warn{color:var(--danger);font-size:13px;margin-top:6px}

@media (max-width:900px){
  .contact-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .contact-row,.grid-4,.grid-2,.prow,.prow2{grid-template-columns:1fr}
  .span-2{grid-column:auto}
  .st-head{flex-wrap:wrap}
  .top-actions{flex-wrap:wrap}
}
@media print{.side,.top-actions,.toast{display:none}}
/* ---- v2.2 : rendez-vous, envoi du devis ---- */
.rdv{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface-2);margin-bottom:6px}
.rdv .field input{background:var(--surface)}
.rdv-actions{display:flex;justify-content:flex-end;margin-top:10px}
.rdv-ok{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-color:var(--olive);background:var(--olive-soft)}
.rdv-main{display:flex;flex-direction:column;gap:2px}
.rdv-badge{align-self:flex-start;font-size:12px;font-weight:600;color:var(--surface);background:var(--olive);border-radius:20px;padding:1px 9px;margin-bottom:2px}
.muted{color:var(--ink-3);font-size:13px}
.lieu-q{display:inline-flex;gap:12px;flex-wrap:wrap}
.lieu-q .linkbtn{margin:0;font-size:12.5px}
.rdv-hist{margin:4px 0 8px;font-size:13px;color:var(--ink-2)}
.rdv-hist summary{cursor:pointer;color:var(--ink-3)}
.rdv-hist ul{margin:6px 0 0;padding-left:18px}
.rdv-hist li{margin-bottom:3px}
.devis-send{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
/* ---- v3 : projets, devis ventilé ---- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{all:unset;cursor:pointer;display:flex;flex-direction:column;padding:8px 14px 9px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:var(--surface-2);margin-bottom:-1px}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--ochre);border-bottom:1px solid var(--surface);box-shadow:inset 0 3px 0 var(--ochre)}
.tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tab-t{font-weight:600}
.tab-s{font-size:12px;color:var(--ink-3)}
.tab-add{color:var(--ink-2);border-style:dashed;justify-content:center;font-size:14px}
.newproj{margin:14px 0 4px;padding:12px;border:1px dashed var(--ochre);border-radius:8px;background:var(--ochre-soft)}
.newproj .chip{background:var(--surface)}
.proj-panel{padding-top:18px}
.devis{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface-2)}
.devis .field input{background:var(--surface)}
.devis-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.dv-wrap{overflow-x:auto;margin-top:12px}
.dv{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}

.rdv-common{font-size:13px;margin:4px 0 8px;color:var(--ink-2)}

.rdv-over ul{margin:0;padding-left:18px}
.rdv-over li{margin:3px 0}
.tag-ok{background:var(--olive-soft);border-color:var(--olive);color:var(--olive)}

<section class="login" id="login" hidden>
  <div class="login-card">
    <h1>Suivi clients</h1>
    <p>Connectez-vous avec votre compte STLS.</p>
    <div class="field"><label for="lg-email">Email</label><input id="lg-email" type="email" autocomplete="username"></div>
    <div class="field"><label for="lg-pass">Mot de passe</label><input id="lg-pass" type="password" autocomplete="current-password"></div>
    <button class="btn primary" id="lg-btn">Se connecter</button>
    <div class="login-err" id="lg-err" role="alert"></div>
    <button class="linkbtn" id="lg-reset">Mot de passe oublié</button>
  </div>
</section>

<div class="app" id="app">
  <aside class="side">
    <div class="side-head">
      <div class="brand"><h1>Suivi clients</h1><small id="count"></small></div>
      <input class="search" id="search" type="search" placeholder="Rechercher un nom, un téléphone…" aria-label="Rechercher un client">
      <button class="btn primary new" id="newBtn">Nouvelle fiche</button>
    </div>
    <ul class="list" id="list"></ul>
    <div class="side-foot">
      <button class="btn ghost paramsBtn" id="paramsBtn" aria-current="false">⚙️ Paramètres</button>
      <div class="store-note who"><span id="whoEmail"></span><button class="btn ghost" id="logoutBtn">Déconnexion</button></div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<dialog id="mailDlg">
  <div class="dlg">
    <h2>Envoyer la fiche par mail</h2>
    <div class="field"><label for="m-to">Destinataire</label><input id="m-to" type="email" multiple placeholder="adresse@exemple.fr (plusieurs : séparez par une virgule)"></div>
    <div class="field"><label for="m-subject">Objet</label><input id="m-subject" type="text"></div>
    <div class="field"><label>Contenu</label>
      <div class="radios">
        <label><input type="radio" name="m-what" value="full" checked> Fiche complète</label>
        <label><input type="radio" name="m-what" value="suivi"> Suivi uniquement</label>
        <label><input type="radio" name="m-what" value="client"> Version client (sans suivi interne)</label>
      </div>
    </div>
    <div class="field"><label for="m-body">Message (modifiable)</label><textarea id="m-body"></textarea></div>
    <div class="dlg-warn" id="m-warn" hidden>Ce message est long : certaines messageries le coupent. Si c’est le cas, utilisez « Copier le texte » et collez-le dans un nouveau mail.</div>
    <div class="dlg-actions">
      <button class="btn ghost" id="m-cancel">Annuler</button>
      <button class="btn" id="m-copy">Copier le texte</button>
      <button class="btn primary" id="m-send">Ouvrir dans ma messagerie</button>
    </div>
  </div>
</dialog>
<dialog id="pdfDlg">
  <div class="dlg">
    <h2>Exporter la fiche en PDF</h2>
    <div class="field"><label>Version</label>
      <div class="radios" style="flex-direction:column;gap:8px">
        <label><input type="radio" name="pdf-v" value="client" checked> <span><b>Version client</b> – coordonnées, projets, devis, échéancier, rendez-vous et avancement. Sans parrain, commission, notes ni suivi interne.</span></label>
        <label><input type="radio" name="pdf-v" value="interne"> <span><b>Version interne</b> – tout, plus le parrainage et la commission, les commandes fournisseurs, le suivi et la synthèse chiffrée des projets.</span></label>
      </div></div>
    <div class="field"><label>Projets à inclure</label><div id="pdf-projs"></div></div>
    <div class="dlg-warn" id="pdf-err" style="background:transparent;padding:0;min-height:1.2em"></div>
    <div class="dlg-actions">
      <button class="btn ghost" id="pdf-cancel">Annuler</button>
      <button class="btn" id="pdf-share" hidden>Partager…</button>

const DEFAULT_PARAMS = {
  tvaRates:[10,20], tvaDefaut:10, tvaNormal:20,

    {nom:"Literie", rubriques:["Literie"], visite:false},
    {nom:"Cuisine extérieure", rubriques:["Meubles","Plan de travail","Électroménager"], visite:true},
    {nom:"Douche vapeur", rubriques:["Description"], visite:true},
    {nom:"Sauna", rubriques:["Description"], visite:true},
    {nom:"Hammam", rubriques:["Description"], visite:true},

const SUIVI_TYPES = ["Appel","Message répondeur","SMS","Email","Rendez-vous","RDV showroom","Visite sur place","Autre"];
const RDV_STEPS = ["s1","s2","s3","s4","s7","s8","s9"];
const STEP_IDS = ["s1","s2","s3","s4","s5","s6","s7","s8","s9"];

/* ---------- État ---------- */
let P = structuredClone(DEFAULT_PARAMS);
let paramsExist = false;
let clients = [];
let selId = null;           // id de fiche, ou "__params"
let selProj = null;         // id du projet affiché
let addingProject = false;
let query = "";
let editingEntry = null;
let openStep = null;
let suiviFilter = "all";    // "all" | "g" | <idProjet> | <idProjet>|<étape>
let unsub = null, unsubP = null;
let me = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const slug = s => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "x";
const ref = id => doc(db, COLLECTION, id);
const current = () => clients.find(x=>x.id===selId);
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- Chemins dans l'objet ---------- */
function getP(o, path){ return path.split(".").reduce((a,k)=>a==null?undefined:a[k], o); }
function setP(o, path, v){
  const ks=path.split("."); let a=o;
  ks.slice(0,-1).forEach((k,i)=>{ if(a[k]==null || typeof a[k]!=="object") a[k] = /^\d+$/.test(ks[i+1]) ? [] : {}; a=a[k]; });
  a[ks[ks.length-1]] = v;
}
// Les commandes d'un projet sont une liste : on l'enregistre en entier.
function arrayRoot(path){ const m=path.match(/^(projets\.[^.]+\.commandes)\./); return m?m[1]:null; }

/* ---------- Dates et montants ---------- */
const pad = n => String(n).padStart(2,"0");
function nowLocal(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const today = () => nowLocal().slice(0,10);
function fmtDT(v){ if(!v) return ""; const [d,t]=v.split("T"); const [y,m,j]=d.split("-"); return t ? `${j}/${m}/${y} à ${t.replace(":","h")}` : `${j}/${m}/${y}`; }
function fmtD(v){ if(!v) return ""; const [y,m,j]=v.slice(0,10).split("-"); return `${j}/${m}/${y}`; }
const eur = n => (n==null||isNaN(n)) ? "–" : new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(n);
const num = v => (v===""||v==null||isNaN(+v)) ? null : +v;
const pctTxt = v => `${String(v).replace(".",",")} %`;

/* ---------- Modèle ---------- */
function stepDefs(){
  return [
    {id:"s1", t:"Découverte", s:"Budget, plan, choix"},
    {id:"s2", t:"Présentation du devis"},
    {id:"s3", t:"Visite technique"},
    {id:"s4", t:"Validation du projet", s:`Acompte ${P.pctAcompte} %`, pay:true},
    {id:"s5", t:"Commande fournisseurs"},
    {id:"s6", t:"Vérification des AR", s:"Accusés de réception"},
    {id:"s7", t:"Réception"},
    {id:"s8", t:"Livraison", s:`Règlement ${P.pctLivraison} %`, pay:true},
    {id:"s9", t:"Installation", s:`Règlement final ${P.pctSolde} %`, pay:true}
  ];
}
const blankAddr = () => ({pays:"FR", dep:"83", cp:"", ville:"", adresse:""});
const blankRdv = () => ({prevu:"", valide:"", lieu:"", historique:[]});
function blankSteps(){ const st={}; STEP_IDS.forEach(s=>{ st[s]={done:false,date:""}; if(RDV_STEPS.includes(s)) st[s].rendezvous=blankRdv(); });
  st.s2.saisie="TTC"; st.s4.saisie="TTC"; return st; }
function blankClient(){
  const now=new Date().toISOString();
  return {id:uid(),
    c1:{civ:"Madame",nom:"",prenom:"",tel:"",mail:""},
    c2:{civ:"Monsieur",nom:"",prenom:"",tel:"",mail:""},
    typeBien:"", install:blankAddr(), factDiff:false, fact:blankAddr(),
    entreprise:false, raisonSociale:"", siret:"", tvaIntra:"",
    parrain:"", notes:"", projets:{}, suivis:[],
    createdAt:now, updatedAt:now, createdBy:me?.email||"", updatedBy:me?.email||""};
}
function blankProjet(c, type){
  const def=P.types.find(t=>t.nom===type);
  const p={id:uid(), type, libelle:"", ordre:Date.now(), createdAt:new Date().toISOString(),
    tva:P.tvaDefaut, commissionPct:null, installation:{prevue:"",historique:[]}, steps:blankSteps(), commandes:[]};
  p.steps.s3.necessaire = def && def.visite===false ? "Non" : "Oui";
  const par=P.parrains.find(x=>x.nom===c.parrain); if(par && par.pct!=null) p.commissionPct=par.pct;
  return p;
}
function normProjet(p){
  const b=blankSteps();
  p.steps=p.steps||{};
  STEP_IDS.forEach(s=>{ p.steps[s]={...b[s],...(p.steps[s]||{})}; });
  RDV_STEPS.forEach(s=>{
    const st=p.steps[s];
    if(!st.rendezvous || typeof st.rendezvous!=="object") st.rendezvous={...blankRdv(), prevu: typeof st.rdv==="string"?st.rdv:"", lieu: st.lieu||""};
    st.rendezvous={...blankRdv(),...st.rendezvous};
    if(!Array.isArray(st.rendezvous.historique)) st.rendezvous.historique=[];
  });
  ["s2","s4"].forEach(s=>{ const st=p.steps[s];
    if(st.montant!=null && st.mat==null && st.elec==null && st.presta==null){ st.mat=st.montant; st.saisie="TTC"; }
    if(!st.saisie) st.saisie="TTC"; });
  if(!p.steps.s3.necessaire) p.steps.s3.necessaire="Oui";
  p.installation={prevue:"",historique:[],...(p.installation||{})};
  p.commandes=Array.isArray(p.commandes)?p.commandes:[];
  if(p.tva==null) p.tva=P.tvaDefaut;
  return p;
}
function normalize(c){
  const b=blankClient();
  // Conversion des fiches v1/v2 (un seul projet porté par la fiche)
  if(!c.projets || typeof c.projets!=="object" || Array.isArray(c.projets)){
    const old = Array.isArray(c.types) ? c.types : (c.typeProjet ? [c.typeProjet] : []);
    let steps=c.steps||{};
    if(Array.isArray(c.etapes)){ c.etapes.forEach((e,i)=>{ steps[STEP_IDS[i]]={...(steps[STEP_IDS[i]]||{}),done:!!e.done,date:e.date||""}; }); }
    const hasData = old.length || Object.keys(steps).length || (c.commandes||[]).length;
    c.projets={};
    if(hasData){
      const t0=old[0]||"Cuisine";
      const p={id:"p1", type:t0, libelle:"", ordre:1, createdAt:c.createdAt||new Date().toISOString(),
        tva:c.tva??P.tvaDefaut, commissionPct:c.commissionPct??null, installation:{prevue:"",historique:[]},
        steps:clone(steps), commandes:clone(c.commandes||[])};
      const rub=p.steps.s1?.rub||{}, nr={};
      Object.keys(rub).forEach(k=>{ const [t,r]=k.split("__"); if(t===slug(t0)) nr[r]=rub[k]; });
      if(p.steps.s1) p.steps.s1.rub=nr;
      c.projets.p1=p;
      old.slice(1).forEach((t,i)=>{ const q=blankProjet(c,t); q.id="p"+(i+2); q.ordre=i+2; c.projets[q.id]=q; });
      (c.suivis||[]).forEach(s=>{ if(s.etape && s.etape!=="g" && !s.projet) s.projet="p1"; });
    }
    c._migrate=true;
    if(c.contact!==undefined && !c.c1){ c.c1={...b.c1, nom:c.contact||"", tel:c.telephone||"", mail:c.email||""}; }
    if(c.localisation && !c.install){ c.install={...b.install, ville:c.localisation}; }
  }
  for(const k of Object.keys(b)) if(c[k]===undefined) c[k]=b[k];
  c.c1={...b.c1,...c.c1}; c.c2={...b.c2,...c.c2};
  c.install={...b.install,...c.install}; c.fact={...b.fact,...c.fact};
  Object.keys(c.projets).forEach(k=>{ c.projets[k].id=k; normProjet(c.projets[k]); });
  c.suivis=Array.isArray(c.suivis)?c.suivis:[];
  c.suivis.forEach(s=>{ if(!s.etape) s.etape="g"; if(s.projet==null) s.projet=""; });
  return c;
}
const projList = c => Object.values(c.projets).sort((a,b)=>(a.ordre||0)-(b.ordre||0));
function projLabel(c,p){
  if(!p) return "";
  if(p.libelle) return p.libelle;
  const same=projList(c).filter(x=>x.type===p.type && !x.libelle);
  return same.length>1 ? `${p.type} ${same.indexOf(p)+1}` : p.type;
}
const curProj = c => c.projets[selProj] || projList(c)[0] || null;

/* ---------- Calculs ---------- */
const civAbbr = v => v==="Monsieur" ? "M." : "Mme";
function personne(p){ return [civAbbr(p.civ), p.prenom, p.nom].filter(Boolean).join(" "); }
function nomFiche(c){
  const ps=[c.c1,c.c2].filter(p=>p.nom||p.prenom);
  if(!ps.length) return "";
  if(ps.length===2 && ps[0].nom && ps[0].nom.toLowerCase()===ps[1].nom.toLowerCase())
    return `${civAbbr(ps[0].civ)} et ${civAbbr(ps[1].civ)} ${ps[0].nom}`;
  return ps.map(personne).join(" & ");
}
const skipped = (p,id) => id==="s3" && p.steps.s3.necessaire==="Non";
const currentStep = p => STEP_IDS.findIndex(s=>!p.steps[s].done && !skipped(p,s));
// Devis : fourniture et prestations au taux du projet, électroménager toujours au taux normal.
function calcDevis(p, st){
  const r=num(p.tva)||0, rn=num(P.tvaNormal)??20, ttcMode=(st.saisie||"TTC")==="TTC";
  const cats=[["mat","Fourniture",r],["elec","Électroménager",rn],["presta","Prestations de services",r]];
  const lines=cats.map(([k,label,rate])=>{
    const a=num(st[k]); if(a==null) return {k,label,rate,ht:null,tva:null,ttc:null};
    const ht = ttcMode ? a/(1+rate/100) : a, ttc = ttcMode ? a : a*(1+rate/100);
    return {k,label,rate,ht,tva:ttc-ht,ttc};
  });
  const has=lines.some(l=>l.ttc!=null), sum=k=>lines.reduce((s,l)=>s+(l[k]||0),0);
  const mat=lines.filter(l=>l.k!=="presta");
  return {lines, has, ht:sum("ht"), tva:sum("tva"), ttc:sum("ttc"),
    materielHT:mat.reduce((s,l)=>s+(l.ht||0),0), prestaTTC:lines[2].ttc||0};
}
function devisRetenu(p){ const d4=calcDevis(p,p.steps.s4); return d4.has ? d4 : calcDevis(p,p.steps.s2); }
function reglements(p){
  const m=devisRetenu(p).ttc;
  const a=m*P.pctAcompte/100, l=m*P.pctLivraison/100, s=m*P.pctSolde/100;
  const recu=(p.steps.s4.done?a:0)+(p.steps.s8.done?l:0)+(p.steps.s9.done?s:0);
  return {m,a,l,s,recu,reste:Math.max(0,m-recu)};
}
function commission(c,p){
  const pct=num(p.commissionPct); if(!c.parrain || pct==null) return null;
  const base=devisRetenu(p).materielHT;
  return {pct, base, montant: base*pct/100};
}

const geoData = {};   // département -> "loading" | [] | [{nom, codesPostaux}]
function ensureGeo(dep){
  if(!dep || geoData[dep]!==undefined || !DEPS.some(d=>d[0]===dep)) return;
  geoData[dep]="loading";
  fetch(`https://geo.api.gouv.fr/departements/${dep}/communes?fields=nom,codesPostaux&format=json`)
    .then(r=>r.ok?r.json():[]).catch(()=>[])
    .then(list=>{
      geoData[dep]=Array.isArray(list)?list:[];
      const a=document.activeElement, typing=a && $("#main").contains(a) && /INPUT|TEXTAREA/.test(a.tagName);
      if(!typing && !dlg.open) rerenderKeep();
    });
}
function geoList(dep){ const g=geoData[dep]; return Array.isArray(g)?g:null; }
function cpsOf(dep){ const l=geoList(dep)||[]; return [...new Set(l.flatMap(x=>x.codesPostaux||[]))].sort(); }
function villesOf(dep,cp){
  const l=geoList(dep)||[];
  const f = cp ? l.filter(x=>(x.codesPostaux||[]).includes(cp)) : l;
  return [...new Set(f.map(x=>x.nom))].sort((a,b)=>a.localeCompare(b,"fr"));
}
/* ---------- Documents (Firebase Storage) ---------- */
async function compress(file){
  if(!file.type.startsWith("image/") || file.size < 1.5e6) return file;
  try{
    const bmp=await createImageBitmap(file);
    const s=Math.min(1, 2000/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*s); cv.height=Math.round(bmp.height*s);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.85));
    return blob ? new File([blob], file.name.replace(/\.\w+$/,"")+".jpg", {type:"image/jpeg"}) : file;
  }catch(e){ return file; }
}
async function uploadDocs(c, path, files){
  if(!files?.length) return;
  for(const f0 of files){
    if(!/^image\/|application\/pdf/.test(f0.type)){ toast(`« ${f0.name} » : seuls les PDF et les photos sont acceptés.`); continue; }
    const f=await compress(f0);
    if(f.size > 15*1024*1024){ toast(`« ${f0.name} » dépasse 15 Mo.`); continue; }
    toast(`Envoi de « ${f.name} »…`, 20000);
    const spath=`${COLLECTION}/${c.id}/${Date.now()}-${slug(f.name.replace(/\.\w+$/,""))}.${(f.name.split(".").pop()||"bin").toLowerCase()}`;
    try{
      await uploadBytes(sref(storage, spath), f, {contentType:f.type});
      const url=await getDownloadURL(sref(storage, spath));
      const meta={name:f.name, path:spath, url, type:f.type, size:f.size, at:new Date().toISOString(), by:me?.email||""};
      const list=getP(c,path)||[]; list.push(meta); setP(c,path,list);
      const root=arrayRoot(path);
      if(root){ flushPending(); await updateFields(c.id,{[root]:JSON.parse(JSON.stringify(getP(c,root)))}); }
      else await updateFields(c.id,{[path]:arrayUnion(meta)});
      toast(`« ${f.name} » archivé`);
      rerenderKeep();
    }catch(e){
      console.error(e);
      toast(e?.code==="storage/unauthorized" ? "Envoi refusé : vérifiez les règles Storage." :
            /storage\/(unknown|bucket-not-found|project-not-found)/.test(e?.code||"") ? "Firebase Storage n’est pas activé sur le projet." : "Envoi impossible.", 5000);
    }
  }
}
async function removeDoc(c, path, idx){
  const list=getP(c,path)||[]; const d=list[idx]; if(!d) return;
  if(!confirm(`Supprimer « ${d.name} » ?`)) return;
  try{ await deleteObject(sref(storage,d.path)); }catch(e){ if(e?.code!=="storage/object-not-found"){ toast("Suppression du fichier impossible."); return; } }
  list.splice(idx,1);
  const root=arrayRoot(path);
  if(root) await updateFields(c.id,{[root]:JSON.parse(JSON.stringify(getP(c,root)))});
  else await updateFields(c.id,{[path]:arrayRemove(d)});
  rerenderKeep();
}

function fmtTva(v){ const s=(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,13); return s.length>2 ? s.slice(0,2)+" "+s.slice(2) : s; }

function rdvTxt(p,id){
  const r=p.steps[id]?.rendezvous; if(!r) return "";
  if(r.valide) return `RDV validé le ${fmtDT(r.valide)}${r.lieu?` (${r.lieu})`:""}`;
  if(r.prevu) return `RDV prévu le ${fmtDT(r.prevu)}`;

}
function stepSummary(c,p,id){
  if(skipped(p,id)) return "Sans objet pour ce projet";
  const s=p.steps[id], r=reglements(p), parts=[rdvTxt(p,id)];
  switch(id){
    case "s1": parts.push(s.datePrevue&&`Projet prévu le ${fmtD(s.datePrevue)}`, num(s.budget)!=null&&`budget max ${eur(num(s.budget))}`); break;
    case "s2": { const d=calcDevis(p,s); parts.push(s.numero&&`Devis ${s.numero}`, d.has&&eur(d.ttc), s.decision); break; }
    case "s3": parts.push(s.planValide&&`Plan validé : ${s.planValide}`); break;
    case "s4": parts.push(r.m?`Acompte ${eur(r.a)}${s.methode?` par ${s.methode.toLowerCase()}`:""}`:""); break;
    case "s5": parts.push(p.commandes.length?`${p.commandes.length} commande${p.commandes.length>1?"s":""}`:""); break;
    case "s6": parts.push(p.commandes.length?`${p.commandes.filter(x=>x.arOk).length}/${p.commandes.length} AR conformes`:""); break;
    case "s7": parts.push(p.commandes.length?`${p.commandes.filter(x=>x.dateReception).length}/${p.commandes.length} commandes reçues`:""); break;
    case "s8": parts.push(r.m?`${eur(r.l)}${s.dateLivraison?`, livraison le ${fmtD(s.dateLivraison)}`:""}`:""); break;
    case "s9": parts.push(s.poseur, r.m&&`solde ${eur(r.s)}`); break;
  }
  return parts.filter(Boolean).join(" – ");
}

function rdvOverview(c){
  const seen=new Set(), rows=[];
  projList(c).forEach(q=>RDV_STEPS.forEach(sid=>{
    const r=q.steps[sid].rendezvous, d=r.valide||r.prevu; if(!d || skipped(q,sid)) return;
    if(r.groupe){ if(seen.has(r.groupe)) return; seen.add(r.groupe); }
    const members = r.groupe ? groupMembers(c,r.groupe) : [{q,s:sid}];
    rows.push({d, ok:!!r.valide, lieu:r.lieu, who:members.map(m=>`${projLabel(c,m.q)} (${stepDefs()[STEP_IDS.indexOf(m.s)].t})`), grouped:!!r.groupe});
  }));
  const now=nowLocal();
  const next=rows.filter(x=>x.d>=now.slice(0,10)).sort((a,b)=>a.d.localeCompare(b.d));
  if(!next.length) return "";
  const days={}; next.forEach(x=>{ const k=x.d.slice(0,10); days[k]=(days[k]||0)+1; });
  return `<div class="rdv-over"><div class="muted" style="margin-bottom:4px">Prochains rendez-vous du client</div><ul>
    ${next.map(x=>`<li><b>${fmtDT(x.d)}</b> ${x.ok?"":"<span class=\"tag\">à valider</span>"} – ${esc(x.who.join(" + "))}${x.lieu?` – ${esc(x.lieu)}`:""}
      ${x.grouped?`<span class="tag tag-ok">RDV commun</span>`:days[x.d.slice(0,10)]>1?`<span class="tag tag-warn">même jour qu’un autre RDV : à regrouper ?</span>`:""}</li>`).join("")}</ul></div>`;
}

function renderMain(){

  if(selId==="__params"){ app.classList.add("has-sel"); main.innerHTML=renderParams(); return; }

  app.classList.toggle("has-sel", !!c);

  main.innerHTML=renderFiche(c);
}
function rerenderKeep(){
  needRefresh=false;
  const a=document.activeElement, id=a?.id, pos=a?.selectionStart, top=$("#main").scrollTop;
  renderMain(); $("#main").scrollTop=top;
  if(id){ const el=document.getElementById(id); if(el){ el.focus({preventScroll:true}); try{ if(pos!=null) el.setSelectionRange(pos,pos);}catch(_){} } }
}
function select(id){ flushPending(); selId=id; selProj=null; addingProject=false; editingEntry=null; openStep=null; suiviFilter="all"; renderList(); renderMain(); $("#main").scrollTop=0; }

/* ---------- Événements : saisie ---------- */
function readVal(el){
  if(el.dataset.kind==="bool") return el.checked;
  if(el.dataset.kind==="num") return num(el.value);
  return el.value;
}
$("#main").addEventListener("input", e=>{
  const el=e.target;
  if(selId==="__params"){ paramInput(el); return; }
  const c=current(); if(!c) return;
  if(el.dataset.fmt==="siret"){ const p=el.selectionStart, before=el.value.length; el.value=fmtSiret(el.value); try{ el.setSelectionRange(p+(el.value.length-before),p+(el.value.length-before)); }catch(_){} }
  if(el.dataset.fmt==="tva"){ el.value=fmtTva(el.value); }
  const p=el.dataset.p; if(!p || el.tagName==="SELECT" || el.type==="checkbox" || el.dataset.nolive!==undefined) return;
  const v=readVal(el);
  const m=p.match(RDV_RE);
  if(m) setRdvField(c,m[1],m[2],m[3],v); else { setP(c,p,v); queue(c,p,v); }
  if(/^c[12]\./.test(p)) renderList();
});
const RDV_RE=/^projets\.([^.]+)\.steps\.(s\d)\.rendezvous\.(prevu|valide|lieu)$/;
function setRdvField(c,pid,sid,field,v){
  const r=c.projets[pid].steps[sid].rendezvous; r[field]=v; queue(c,`projets.${pid}.steps.${sid}.rendezvous.${field}`,v);
  groupMembers(c,r.groupe).forEach(({q,s})=>{ if(q.id===pid&&s===sid) return;
    q.steps[s].rendezvous[field]=v; queue(c,`projets.${q.id}.steps.${s}.rendezvous.${field}`,v); });
}
$("#main").addEventListener("change", e=>{
  const el=e.target;
  if(selId==="__params"){ paramChange(el); return; }
  const c=current(); if(!c) return;
  const p0=curProj(c);
  if(el.dataset.up){ uploadDocs(c, el.dataset.up, [...el.files]); el.value=""; return; }
  if(el.dataset.rdvLink){ const [pid,sid,qid]=el.dataset.rdvLink.split("|"); lierRdv(c,pid,sid,qid,el.checked); return; }
  if(el.dataset.nbcmd!==undefined){ setCmdCount(c, c.projets[el.dataset.nbcmd], Math.max(0,Math.min(20,parseInt(el.value)||0))); return; }
  if(el.dataset.done && p0){
    const sid=el.dataset.done, s=p0.steps[sid]; s.done=el.checked; s.date=el.checked?(s.date||today()):"";
    flushPending(); updateFields(c.id,{[`projets.${p0.id}.steps.${sid}.done`]:s.done,[`projets.${p0.id}.steps.${sid}.date`]:s.date});
    rerenderKeep(); renderList(); return;
  }
  const p=el.dataset.p; if(!p) return;
  if(el.tagName==="SELECT" && el.value==="__add"){ addFromSelect(c,p,el); return; }
  const v=readVal(el);
  // décalage de la date d'installation : on garde l'ancienne date
  if(/^projets\.[^.]+\.installation\.prevue$/.test(p)){
    const pr=c.projets[p.split(".")[1]], old=pr.installation.prevue||"";
    if(old===v) return;
    let motif="";
    if(old){ const m=prompt(`Installation décalée du ${fmtD(old)} au ${v?fmtD(v):"(non fixée)"}.\nMotif (facultatif) :`,""); if(m===null){ el.value=old; return; } motif=m.trim(); }
    pr.installation.prevue=v;
    if(old) pr.installation.historique=[...pr.installation.historique,{de:old,a:v,motif,at:nowLocal(),by:me?.email||""}];
    flushPending(); updateFields(c.id,{[`projets.${pr.id}.installation`]:clone(pr.installation)});
    logSuivi(c,pr.id,"g", old?`Installation décalée du ${fmtD(old)} au ${v?fmtD(v):"(non fixée)"}${motif?` : ${motif}`:""}.`:`Installation prévue le ${fmtD(v)}.`, "Autre");
    rerenderKeep(); renderList(); return;
  }
  setP(c,p,v);
  if(p==="parrain"){
    const def=P.parrains.find(x=>x.nom===v);
    projList(c).forEach(pr=>{ if(!v) pr.commissionPct=null; else if(def?.pct!=null && pr.commissionPct==null) pr.commissionPct=def.pct; queue(c,`projets.${pr.id}.commissionPct`,pr.commissionPct); });
  }
  if(/^(install|fact)\.cp$/.test(p) && geoList(c[p.split(".")[0]].dep)){
    const blk=p.split(".")[0], vs=villesOf(c[blk].dep, v);
    const nv = vs.length===1 ? vs[0] : (vs.includes(c[blk].ville) ? c[blk].ville : "");
    if(nv!==c[blk].ville){ c[blk].ville=nv; queue(c,`${blk}.ville`,nv); }
  }
  if(/^(install|fact)\.ville$/.test(p) && geoList(c[p.split(".")[0]].dep)){
    const blk=p.split(".")[0];
    const cps=[...new Set((geoList(c[blk].dep)||[]).filter(x=>x.nom===v).flatMap(x=>x.codesPostaux||[]))];
    if(cps.length===1 && c[blk].cp!==cps[0]){ c[blk].cp=cps[0]; queue(c,`${blk}.cp`,cps[0]); }
  }
  if(/^(install|fact)\.(pays|dep)$/.test(p)){
    const blk=p.split(".")[0];
    if(p.endsWith("pays")){ c[blk].dep = v==="FR" ? "83" : ""; queue(c,`${blk}.dep`,c[blk].dep); }
    c[blk].cp=""; c[blk].ville=""; queue(c,`${blk}.cp`,""); queue(c,`${blk}.ville`,"");
  }
  queue(c,p,v); flushPending();
  refreshAfter(el); renderList();
});
/* Après une saisie dans un champ texte, on ne redessine pas tout de suite :
   l'utilisateur est peut-être en train de cliquer dans un autre champ ou d'ouvrir un menu. */
let needRefresh=false;
const isTextField = el => el.tagName==="TEXTAREA" || (el.tagName==="INPUT" && !/^(checkbox|radio|file)$/.test(el.type));
const fieldFocused = () => { const a=document.activeElement; return a && $("#main").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName); };
function refreshAfter(el){
  if(isTextField(el)){ needRefresh=true; setTimeout(tryRefresh,0); }
  else rerenderKeep();
}
function tryRefresh(){ if(needRefresh && !fieldFocused() && !dlg.open){ needRefresh=false; rerenderKeep(); } }
$("#main").addEventListener("focusout", ()=>setTimeout(tryRefresh,60));

function addFromSelect(c,p,el){
  const label = p==="typeBien" ? "Nouveau type de bien :" : "Nom du parrain :";
  const v=(prompt(label)||"").trim();
  if(!v){ el.value=getP(c,p)||""; return; }
  if(p==="typeBien"){ if(!P.biens.includes(v)) P.biens.push(v); }
  else if(!P.parrains.some(x=>x.nom===v)){ const pct=num((prompt(`Commission par défaut de ${v} (%) :`, "")||"").replace(",", ".")); P.parrains.push({nom:v,pct}); }
  saveParams(true);
  setP(c,p,v); queue(c,p,v);
  if(p==="parrain"){ const def=P.parrains.find(x=>x.nom===v);
    projList(c).forEach(pr=>{ if(def?.pct!=null && pr.commissionPct==null){ pr.commissionPct=def.pct; queue(c,`projets.${pr.id}.commissionPct`,def.pct); } }); }
  flushPending(); rerenderKeep();
}
function setCmdCount(c,p,n){
  const cur=p.commandes.length;
  if(n<cur){
    const lost=p.commandes.slice(n).some(x=>x.fournisseur||x.numero||x.docs?.length||x.arDocs?.length);
    if(lost && !confirm(`Retirer ${cur-n} commande(s) déjà renseignée(s) ?`)){ rerenderKeep(); return; }
    p.commandes=p.commandes.slice(0,n);
  } else { for(let i=cur;i<n;i++) p.commandes.push({id:uid(),fournisseur:"",numero:"",dateCommande:"",dateLivPrevue:"",dateReception:"",docs:[],arOk:false,arModif:"",arDocs:[]}); }
  flushPending(); updateFields(c.id,{[`projets.${p.id}.commandes`]:clone(p.commandes)}); rerenderKeep();
}
async function addProjet(c,type){
  const p=blankProjet(c,type); c.projets[p.id]=p;
  flushPending(); await updateFields(c.id,{[`projets.${p.id}`]:clone(p)});
  logSuivi(c,p.id,"g",`Nouveau projet : ${type}.`,"Autre");
  selProj=p.id; addingProject=false; openStep=null; rerenderKeep(); renderList();
}

/* ---------- Événements : clics ---------- */
$("#main").addEventListener("click", async e=>{
  const t=e.target;
  if(t.closest("#backBtn")){ select(null); return; }
  if(selId==="__params"){ paramClick(t); return; }
  const c=current(); if(!c) return;
  const p=curProj(c);

  if(t.closest("#delBtn")){
    if(confirm(`Supprimer la fiche de ${nomFiche(c)||"ce client"}, tous ses projets et tout son suivi ?`)){
      try{ await deleteDoc(ref(c.id)); const id=c.id; pendingFields.clear(); clients=clients.filter(x=>x.id!==id); select(null); toast("Fiche supprimée"); }
      catch(err){ toast(err?.code==="permission-denied"?"Seul un administrateur peut supprimer une fiche.":"Suppression impossible."); }
    }
    return;
  }
  if(t.closest("#exportBtn")){ flushPending(); openPdf(c); return; }
  if(t.closest("#mailBtn")){ flushPending(); openMail(c); return; }

  // projets
  const tb=t.closest("[data-proj]");
  if(tb){ flushPending(); selProj=tb.dataset.proj; addingProject=false; openStep=null; suiviFilter="all"; editingEntry=null; rerenderKeep(); return; }
  if(t.closest("[data-addproj]")){ addingProject=!addingProject; rerenderKeep(); return; }
  const np=t.closest("[data-newproj]");
  if(np){ addProjet(c, np.dataset.newproj); return; }
  if(t.closest("[data-newproj-other]")){
    const v=(prompt("Type du nouveau projet :")||"").trim(); if(!v) return;
    if(!P.types.some(x=>x.nom===v)){ P.types.push({nom:v,rubriques:["Description"],visite:true}); saveParams(true); }
    addProjet(c,v); return;
  }
  const dp=t.closest("[data-delproj]");
  if(dp){ const pr=c.projets[dp.dataset.delproj];
    if(!confirm(`Supprimer le projet « ${projLabel(c,pr)} » et toutes ses étapes ? Le suivi déjà noté est conservé.`)) return;
    flushPending(); delete c.projets[pr.id];
    await updateFields(c.id,{[`projets.${pr.id}`]:deleteField()});
    selProj=null; openStep=null; rerenderKeep(); renderList(); toast("Projet supprimé"); return; }

  if(!p && !t.closest("[data-filter],[data-add-entry],[data-cancel-edit],[data-edit],[data-del],[data-set],[data-tvasug]")) return;

  const g=t.closest("[data-goto]");
  if(g){ openStep=g.dataset.goto; renderMain(); document.getElementById("st-"+openStep)?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  const os=t.closest("[data-open-step]");
  if(os){ openStep = openStep===os.dataset.openStep ? "" : os.dataset.openStep; rerenderKeep(); return; }

  const sg=t.closest("[data-set]");
  if(sg){ const path=sg.dataset.set, cur=getP(c,path)||"";
    const v = (cur===sg.dataset.v && sg.dataset.req===undefined) ? "" : sg.dataset.v;
    setP(c,path,v); queue(c,path,v); flushPending();
    if(/\.steps\.s3\.necessaire$/.test(path)){ const pr=c.projets[path.split(".")[1]];
      logSuivi(c,pr.id,"s3", v==="Non"?"Visite technique non nécessaire pour ce projet.":"Visite technique nécessaire pour ce projet.","Autre"); }
    rerenderKeep(); renderList(); return; }
  if(t.closest("[data-tvasug]")){ c.tvaIntra=tvaFromSiret(c.siret); queue(c,"tvaIntra",c.tvaIntra); flushPending(); rerenderKeep(); return; }
  const dd=t.closest("[data-deldoc]");
  if(dd){ removeDoc(c, dd.dataset.deldoc, +dd.dataset.i); return; }
  const ac=t.closest("[data-addcmd]");
  if(ac){ const pr=c.projets[ac.dataset.addcmd]; setCmdCount(c, pr, pr.commandes.length+1); return; }
  const dc=t.closest("[data-delcmd]");
  if(dc){ const [pid,i]=dc.dataset.delcmd.split("|"); const pr=c.projets[pid]; const x=pr.commandes[+i];
    if((x.fournisseur||x.docs?.length) && !confirm("Retirer cette commande ?")) return;
    pr.commandes.splice(+i,1); flushPending(); updateFields(c.id,{[`projets.${pid}.commandes`]:clone(pr.commandes)}); rerenderKeep(); return; }
  const rv=t.closest("[data-rdv-val]");
  if(rv){ flushPending(); const [pid,sid]=rv.dataset.rdvVal.split("|"); validerRdv(c, c.projets[pid], sid); return; }
  const rm=t.closest("[data-rdv-mod]");
  if(rm){ flushPending(); const [pid,sid]=rm.dataset.rdvMod.split("|"); modifierRdv(c, c.projets[pid], sid); return; }
  const rl=t.closest("[data-rdv-lieu]");
  if(rl){ const [pid,sid]=rl.dataset.rdvLieu.split("|"), v = rl.dataset.v==="install" ? addrText(c.install) : rl.dataset.v;
    if(!v){ toast("Renseignez d’abord l’adresse d’installation."); return; }
    setRdvField(c,pid,sid,"lieu",v); flushPending(); rerenderKeep(); return; }
  const sd=t.closest("[data-send-devis]");
  if(sd){ flushPending(); openMail(c,"devis",c.projets[sd.dataset.sendDevis]); return; }
  const pa=t.closest("[data-print-ar]");
  if(pa){ flushPending(); const [pid,i]=pa.dataset.printAr.split("|"); printAR(c, c.projets[pid], +i); return; }

  const fl=t.closest("[data-filter]");
  if(fl){ suiviFilter=fl.dataset.filter; rerenderKeep(); return; }
  const ae=t.closest("[data-add-entry]");
  if(ae){
    const sc=ae.dataset.addEntry, projet= sc==="gen" ? "" : sc;
    const date=$(`#s-date-${sc}`).value||nowLocal(), type=$(`#s-type-${sc}`).value, note=$(`#s-note-${sc}`).value.trim();
    const etape= projet ? $(`#s-etape-${sc}`).value : "g";
    flushPending();
    if(editingEntry){
      const s=c.suivis.find(x=>x.id===editingEntry); if(s) Object.assign(s,{date,type,projet,etape,note});
      editingEntry=null; updateFields(c.id,{suivis:clone(c.suivis)}); toast("Contact modifié");
    } else {
      const entry={id:uid(),date,type,projet,etape,note,by:me?.email||""};
      c.suivis.push(entry); updateFields(c.id,{suivis:arrayUnion(entry)}); toast("Contact ajouté au suivi");
    }
    rerenderKeep(); renderList(); return;
  }
  if(t.closest("[data-cancel-edit]")){ editingEntry=null; rerenderKeep(); return; }
  const eb=t.closest("button[data-edit]");
  if(eb){ editingEntry=eb.dataset.edit; const en=c.suivis.find(x=>x.id===editingEntry);
    const sc = en && en.projet && c.projets[en.projet] ? en.projet : "gen";
    renderMain(); document.getElementById(`addForm-${sc}`)?.scrollIntoView({block:"center"}); document.getElementById(`s-note-${sc}`)?.focus(); return; }
  const db_=t.closest("button[data-del]");
  if(db_ && confirm("Supprimer ce contact du suivi ?")){
    const entry=c.suivis.find(s=>s.id===db_.dataset.del);
    c.suivis=c.suivis.filter(s=>s.id!==db_.dataset.del);
    if(editingEntry===db_.dataset.del) editingEntry=null;
    if(entry) updateFields(c.id,{suivis:arrayRemove(entry)});
    rerenderKeep(); renderList();
  }
});

function logSuivi(c, projet, etape, note, type="Rendez-vous"){

function stepLabel(c,p,id){ const i=STEP_IDS.indexOf(id); return `${projLabel(c,p)}, étape ${i+1} (${stepDefs()[i].t})`; }
function rdvTargets(c,p,id){ const r=p.steps[id].rendezvous; const m=groupMembers(c,r.groupe); return m.length?m:[{q:p,s:id}]; }
async function validerRdv(c,p,id){
  const r=p.steps[id].rendezvous;
  const v=r.valide||r.prevu;
  if(!v){ toast("Indiquez le jour et l’heure du RDV."); return; }
  const fields={}, targets=rdvTargets(c,p,id);
  targets.forEach(({q,s})=>{ const x=q.steps[s].rendezvous, b=`projets.${q.id}.steps.${s}.rendezvous`;
    x.valide=v; x.prevu=r.prevu||v; x.lieu=r.lieu||"";
    fields[`${b}.valide`]=x.valide; fields[`${b}.prevu`]=x.prevu; fields[`${b}.lieu`]=x.lieu; });
  await updateFields(c.id,fields);
  targets.forEach(({q,s})=>logSuivi(c,q.id,s,`RDV validé (${stepLabel(c,q,s)}) : ${fmtDT(v)}${r.lieu?`, ${r.lieu}`:""}${targets.length>1?" – RDV commun":""}.`));
  rerenderKeep(); renderList();
}
async function modifierRdv(c,p,id){
  const motif=prompt("Motif de la modification (facultatif) :","");
  if(motif===null) return;
  const fields={}, targets=rdvTargets(c,p,id), r0=p.steps[id].rendezvous, was=r0.valide||r0.prevu;
  targets.forEach(({q,s})=>{ const r=q.steps[s].rendezvous;
    const h={prevu:r.prevu||"",valide:r.valide||"",lieu:r.lieu||"",motif:motif.trim(),at:nowLocal(),by:me?.email||""};
    r.historique=[...(r.historique||[]),h]; r.prevu=r.valide||r.prevu; r.valide="";
    fields[`projets.${q.id}.steps.${s}.rendezvous`]=clone(r); });
  await updateFields(c.id,fields);
  targets.forEach(({q,s})=>logSuivi(c,q.id,s,`RDV à modifier (${stepLabel(c,q,s)}), était le ${fmtDT(was)}${motif.trim()?` : ${motif.trim()}`:""}.`));
  openStep=id; rerenderKeep(); renderList();
  setTimeout(()=>document.getElementById(`f-projets-${p.id}-steps-${id}-rendezvous-prevu`)?.focus(),0);
}
async function lierRdv(c,pid,sid,qid,on){
  const p=c.projets[pid], q=c.projets[qid], r=p.steps[sid].rendezvous;
  flushPending();
  const fields={};
  if(on){
    const qs=document.getElementById(`lk-${pid}-${sid}-${qid}`)?.value; if(!qs) return;
    const gid=r.groupe||uid(); r.groupe=gid; fields[`projets.${pid}.steps.${sid}.rendezvous.groupe`]=gid;
    const t=q.steps[qs].rendezvous;
    if((t.prevu||t.valide) && (t.prevu!==r.prevu || t.valide!==r.valide) &&
       !confirm(`Le projet ${projLabel(c,q)} avait déjà un RDV (${fmtDT(t.valide||t.prevu)}). Le remplacer par celui-ci ?`)){ rerenderKeep(); return; }
    if(t.prevu||t.valide) t.historique=[...(t.historique||[]),{prevu:t.prevu,valide:t.valide,lieu:t.lieu,motif:"Regroupé avec "+projLabel(c,p),at:nowLocal(),by:me?.email||""}];
    Object.assign(t,{prevu:r.prevu,valide:r.valide,lieu:r.lieu,groupe:gid});
    fields[`projets.${qid}.steps.${qs}.rendezvous`]=clone(t);
    await updateFields(c.id,fields);
    logSuivi(c,qid,qs,`RDV regroupé avec ${stepLabel(c,p,sid)}${r.valide||r.prevu?` : ${fmtDT(r.valide||r.prevu)}`:""}.`);
  } else {
    const m=groupMembers(c,r.groupe).find(x=>x.q.id===qid); if(!m) return;
    m.q.steps[m.s].rendezvous.groupe=""; fields[`projets.${qid}.steps.${m.s}.rendezvous.groupe`]="";
    const rest=groupMembers(c,r.groupe);
    if(rest.length<=1) rest.forEach(x=>{ x.q.steps[x.s].rendezvous.groupe=""; fields[`projets.${x.q.id}.steps.${x.s}.rendezvous.groupe`]=""; });
    await updateFields(c.id,fields);
    logSuivi(c,qid,m.s,`RDV séparé de ${stepLabel(c,p,sid)}.`);
  }
  rerenderKeep(); renderList();
}

function addrText(a){ return [a.adresse, [a.cp,a.ville].filter(Boolean).join(" "), a.pays&&a.pays!=="FR"?(PAYS.find(p=>p[0]===a.pays)?.[1]||a.pays):""].filter(Boolean).join(", "); }
function devisLines(p,st,L){
  const d=calcDevis(p,st); if(!d.has) return;
  d.lines.filter(l=>l.ttc!=null).forEach(l=>L.push(`   ${l.label} (TVA ${pctTxt(l.rate)}) : ${eur(l.ht)} HT – ${eur(l.ttc)} TTC`));

function toText(c, what="full"){
  const L=[], defs=stepDefs();
  L.push(`FICHE CLIENT – ${nomFiche(c)||c.raisonSociale||"Sans nom"}`,"");
  if(what!=="suivi"){
    L.push("COORDONNÉES");
    [c.c1,c.c2].filter(p=>p.nom||p.prenom).forEach(p=>L.push(`${personne(p)}${p.tel?` – ${p.tel}`:""}${p.mail?` – ${p.mail}`:""}`));
    if(addrText(c.install)) L.push(`Installation : ${addrText(c.install)}`);
    if(c.typeBien) L.push(`Type de bien : ${c.typeBien}`);
    if(c.factDiff && addrText(c.fact)) L.push(`Facturation : ${addrText(c.fact)}`);
    if(c.entreprise) L.push(`Entreprise : ${c.raisonSociale||""}${c.siret?` – SIRET ${c.siret}`:""}${c.tvaIntra?` – TVA ${c.tvaIntra}`:""}`);
    if(what==="full"){ if(c.parrain) L.push(`Parrain : ${c.parrain}`); if(c.notes) L.push(`Notes : ${c.notes}`); }
    projList(c).forEach(p=>{
      const r=reglements(p), com=commission(c,p), s1=p.steps.s1;
      L.push("",`PROJET ${projLabel(c,p).toUpperCase()}${p.libelle?` (${p.type})`:""} – TVA ${pctTxt(p.tva)}`);
      if(p.installation.prevue) L.push(`Installation prévue le ${fmtD(p.installation.prevue)}${p.installation.historique.length?` (décalée ${p.installation.historique.length} fois)`:""}`);
      if(s1.datePrevue) L.push(`Date prévue du projet : ${fmtD(s1.datePrevue)}`);
      if(num(s1.budget)!=null) L.push(`Budget maximum : ${eur(num(s1.budget))} TTC`);
      const def=P.types.find(x=>x.nom===p.type);
      (def?.rubriques||["Description"]).forEach(rb=>{ const v=s1.rub?.[slug(rb)]; if(v?.texte||v?.comment) L.push(`– ${rb} : ${[v.texte,v.comment].filter(Boolean).join(" / ")}`); });
      const st4=calcDevis(p,p.steps.s4).has?p.steps.s4:p.steps.s2;
      if(calcDevis(p,st4).has){ L.push(`Devis ${st4===p.steps.s4?"définitif":"prévu"}${st4.numero?` n° ${st4.numero}`:""} :`); devisLines(p,st4,L); }
      if(what==="full" && com) L.push(`Commission parrain : ${pctTxt(com.pct)} de ${eur(com.base)} HT, soit ${eur(com.montant)}`);
      defs.forEach((d,i)=>{ const st=p.steps[d.id], sm=stepSummary(c,p,d.id), sk=skipped(p,d.id);
        L.push(`${sk?"[-]":st.done?"[x]":"[ ]"} ${i+1}. ${d.t}${d.s&&!sk?` (${d.s})`:""}${st.done&&st.date&&!sk?` – fait le ${fmtD(st.date)}`:""}${sm?` – ${sm}`:""}`); });
      if(r.m) L.push(`Encaissé : ${eur(r.recu)} sur ${eur(r.m)} – reste : ${eur(r.reste)}`);
      if(what==="full" && p.commandes.length){
        L.push("Commandes fournisseurs :");
        p.commandes.forEach((x,i)=>L.push(`  ${i+1}. ${x.fournisseur||"?"}${x.numero?` n° ${x.numero}`:""}${x.dateCommande?`, commandée le ${fmtD(x.dateCommande)}`:""}${x.dateLivPrevue?`, prévue le ${fmtD(x.dateLivPrevue)}`:""}${x.dateReception?`, reçue le ${fmtD(x.dateReception)}`:""}${x.arOk?", AR conforme":""}`));
      }
    });
    L.push("");
  }
  if(what!=="client"){
    L.push("SUIVI");
    const s=[...c.suivis].sort((a,b)=>b.date.localeCompare(a.date));
    if(!s.length) L.push("Aucun contact noté.");
    s.forEach(x=>{ L.push(`– ${fmtDT(x.date)} – ${x.type} – ${suiviLabel(c,x)}${x.by?` (${x.by.split("@")[0]})`:""}`); if(x.note) L.push(`  ${x.note.replace(/\n/g,"\n  ")}`); });
    L.push("");
  }
  L.push("—",STLS.nom);
  return L.join("\n");
}

const PDF_LIBS=["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
                "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"];
function loadScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error(src)); document.head.appendChild(s); }); }
async function loadPdfLib(){
  if(window.jspdf?.jsPDF?.API?.autoTable) return;
  if(!window.jspdf) await loadScript(PDF_LIBS[0]);
  if(!window.jspdf.jsPDF.API.autoTable) await loadScript(PDF_LIBS[1]);
}
// Les polices standard du PDF ne connaissent que l'alphabet latin : on nettoie le texte.
const PT = s => String(s??"").replace(/[\u202F\u00A0\u2009]/g," ").replace(/[^\x09\x0A\x20-\x7E\xA0-\xFF€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ]/g,"");
const peur = n => PT(eur(n));

function buildPdf(c, version, pids){
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({unit:"mm",format:"a4"});
  const interne = version==="interne";
  const W=210, M=15, ink=[24,33,44], ochre=[217,151,28], grey=[110,120,130];
  let y=M;
  const ensure=h=>{ if(y+h>282){ pdf.addPage(); y=M; } };
  const text=(t,x,o={})=>{ pdf.setFont("helvetica",o.bold?"bold":"normal"); pdf.setFontSize(o.size||10); pdf.setTextColor(...(o.color||ink));
    const lines=pdf.splitTextToSize(PT(t), o.w||(W-2*M)); ensure(lines.length*(o.lh||4.6)); pdf.text(lines,x,y); y+=lines.length*(o.lh||4.6); };
  const h2=t=>{ ensure(14); y+=3; pdf.setFillColor(...ochre); pdf.rect(M,y-4.2,1.6,6,"F"); text(t,M+4,{bold:true,size:13}); y+=1.5; };
  const h3=t=>{ ensure(10); y+=2; text(t,M,{bold:true,size:10.5,color:grey}); y+=0.5; };
  const table=(head,body,o={})=>{ if(!body.length) return; pdf.autoTable({startY:y, head:head?[head.map(PT)]:undefined, body:body.map(r=>r.map(PT)), foot:o.foot?[o.foot.map(PT)]:undefined,
      margin:{left:M,right:M}, theme:o.theme||"grid", styles:{font:"helvetica",fontSize:9,cellPadding:1.8,textColor:ink,lineColor:[205,211,217],lineWidth:0.2},
      headStyles:{fillColor:[233,236,239],textColor:ink,fontStyle:"bold"}, footStyles:{fillColor:[244,246,248],textColor:ink,fontStyle:"bold"},
      columnStyles:o.cols||{},
      didParseCell:dd=>{ if(o.right && o.right.includes(dd.column.index)) dd.cell.styles.halign="right"; } });
    y=pdf.lastAutoTable.finalY+4; };
  const kv=rows=>table(null, rows.filter(r=>r[1]), {theme:"plain", cols:{0:{fontStyle:"bold",cellWidth:48}}});

  // En-tête
  pdf.setFont("helvetica","bold"); pdf.setFontSize(16); pdf.setTextColor(...ink); pdf.text(STLS.nom, M, y+4);
  pdf.setFont("helvetica","normal"); pdf.setFontSize(8.5); pdf.setTextColor(...grey);
  pdf.text(PT([STLS.adresse, `Tél. ${STLS.tel} – ${STLS.mail}`, `SIRET ${STLS.siret} – TVA ${STLS.tva}`].join("\n")), M, y+9);
  pdf.setFont("helvetica","bold"); pdf.setFontSize(12); pdf.setTextColor(...ink);
  pdf.text(PT(interne?"FICHE CLIENT – DOCUMENT INTERNE":"FICHE PROJET"), W-M, y+4, {align:"right"});
  pdf.setFont("helvetica","normal"); pdf.setFontSize(9); pdf.setTextColor(...grey);
  pdf.text(PT(`Édité le ${fmtD(today())}`), W-M, y+9, {align:"right"});
  if(interne){ pdf.setTextColor(179,38,30); pdf.setFont("helvetica","bold"); pdf.text("Confidentiel – ne pas transmettre au client", W-M, y+14, {align:"right"}); }
  y+=24; pdf.setDrawColor(...ochre); pdf.setLineWidth(0.6); pdf.line(M,y,W-M,y); y+=6;

  // Client
  h2(nomFiche(c)||c.raisonSociale||"Client");
  kv([
    ...[c.c1,c.c2].filter(p=>p.nom||p.prenom).map((p,i)=>[i?"Contact 2":"Contact", [personne(p),p.tel,p.mail].filter(Boolean).join("  –  ")]),
    ["Adresse d’installation", addrText(c.install)],
    ["Type de bien", c.typeBien],
    ["Adresse de facturation", c.factDiff?addrText(c.fact):""],
    ["Entreprise", c.entreprise?[c.raisonSociale, c.siret&&`SIRET ${c.siret}`, c.tvaIntra&&`TVA ${c.tvaIntra}`].filter(Boolean).join("  –  "):""],
    ...(interne?[["Parrain", c.parrain],["Notes", c.notes]]:[])
  ]);

  const defs=stepDefs(), projs=projList(c).filter(p=>pids.includes(p.id)), synth=[];
  projs.forEach(p=>{
    const s1=p.steps.s1, r=reglements(p), com=commission(c,p);
    const useDef=calcDevis(p,p.steps.s4).has, st=useDef?p.steps.s4:p.steps.s2, d=calcDevis(p,st);
    ensure(40); y+=2;
    h2(`Projet ${projLabel(c,p)}${p.libelle?` (${p.type})`:""}`);
    kv([["Installation prévue", p.installation.prevue?fmtD(p.installation.prevue):"À définir"],
        ["Date prévue du projet", s1.datePrevue?fmtD(s1.datePrevue):""],
        ["Budget indiqué", num(s1.budget)!=null?`${peur(num(s1.budget))} TTC`:""],
        ...(interne&&p.installation.historique.length?[["Décalages", p.installation.historique.map(h=>`${h.de?fmtD(h.de):"?"} → ${h.a?fmtD(h.a):"?"}${h.motif?` (${h.motif})`:""}`).join(" ; ")]]:[])]);
    const def=P.types.find(x=>x.nom===p.type);
    const rubs=(def?.rubriques||["Description"]).map(rb=>{ const v=s1.rub?.[slug(rb)]; return v&&(v.texte||v.comment) ? [rb, [v.texte, v.comment&&`Commentaire : ${v.comment}`].filter(Boolean).join("\n")] : null; }).filter(Boolean);
    if(rubs.length){ h3("Description du projet"); table(["Rubrique","Détail"], rubs, {cols:{0:{cellWidth:42,fontStyle:"bold"}}}); }
    if(d.has){
      h3(`Devis ${useDef?"définitif":"prévu"}${st.numero?` n° ${st.numero}`:""}`);
      table(["Poste","TVA","HT","Montant TVA","TTC"], d.lines.filter(l=>l.ttc!=null).map(l=>[l.label,pctTxt(l.rate),peur(l.ht),peur(l.tva),peur(l.ttc)]),
        {foot:["Total","",peur(d.ht),peur(d.tva),peur(d.ttc)], right:[1,2,3,4]});
      h3("Échéancier de règlement");
      const ech=[["Acompte à la validation",P.pctAcompte,r.a,p.steps.s4],["À la livraison",P.pctLivraison,r.l,p.steps.s8],["Solde à l’installation",P.pctSolde,r.s,p.steps.s9]];
      table(["Échéance","%","Montant TTC","Statut"], ech.map(([l,pc,m,stp])=>[l,`${pc} %`,peur(m),stp.done?`Réglé${stp.date?` le ${fmtD(stp.date)}`:""}`:"À venir"]),
        {foot:["Reste à régler","",peur(r.reste),""], right:[1,2]});
    }
    const rdvs=RDV_STEPS.filter(sid=>!skipped(p,sid)).map(sid=>{ const rv=p.steps[sid].rendezvous, dt=rv.valide||rv.prevu; if(!dt) return null;
      return [`${STEP_IDS.indexOf(sid)+1}. ${defs[STEP_IDS.indexOf(sid)].t}`, fmtDT(dt), rv.valide?"Confirmé":"À confirmer", rv.lieu||""]; }).filter(Boolean);
    if(rdvs.length){ h3("Rendez-vous"); table(["Étape","Date","Statut","Lieu"], rdvs); }
    h3("Avancement");
    table(["Étape","Statut"], defs.map((df,i)=>{ const x=p.steps[df.id];
      return [`${i+1}. ${df.t}`, skipped(p,df.id)?"Sans objet":x.done?`Réalisé${x.date?` le ${fmtD(x.date)}`:""}`:(currentStep(p)===i?"En cours":"À venir")]; }), {cols:{0:{cellWidth:80}}});
    if(interne){
      if(c.parrain){ h3("Parrainage (confidentiel)");
        kv([["Parrain", c.parrain],["Commission", com?`${pctTxt(com.pct)} de ${peur(com.base)} HT de matériel, soit ${peur(com.montant)}`:"Taux non renseigné"]]); }
      if(p.commandes.length){ h3("Commandes fournisseurs");
        table(["Fournisseur","N°","Commandé","Livraison prévue","Reçu","AR"], p.commandes.map(x=>[x.fournisseur||"",x.numero||"",fmtD(x.dateCommande),fmtD(x.dateLivPrevue),fmtD(x.dateReception),x.arOk?"Conforme":"À vérifier"])); }
      const sv=c.suivis.filter(x=>x.projet===p.id).sort((a,b)=>b.date.localeCompare(a.date));
      if(sv.length){ h3("Suivi du projet");
        table(["Date","Type","Étape","Compte rendu","Par"], sv.map(x=>[fmtDT(x.date),x.type,x.etape==="g"?"Général":String(STEP_IDS.indexOf(x.etape)+1),x.note||"",(x.by||"").split("@")[0]]),
          {cols:{0:{cellWidth:28},1:{cellWidth:24},2:{cellWidth:14},4:{cellWidth:20}}}); }
      synth.push([projLabel(c,p), d.has?peur(d.ht):"–", d.has?peur(d.ttc):"–", peur(r.recu), peur(r.reste), com?peur(com.montant):"–", {ht:d.has?d.ht:0, ttc:d.has?d.ttc:0, recu:r.recu, reste:r.reste, com:com?com.montant:0}]);
    }
  });
  if(interne){
    const gen=c.suivis.filter(x=>!x.projet||!c.projets[x.projet]).sort((a,b)=>b.date.localeCompare(a.date));
    if(gen.length){ h2("Suivi général du client");
      table(["Date","Type","Compte rendu","Par"], gen.map(x=>[fmtDT(x.date),x.type,x.note||"",(x.by||"").split("@")[0]]), {cols:{0:{cellWidth:28},1:{cellWidth:26},3:{cellWidth:20}}}); }
    if(synth.length){
      h2(synth.length>1?"Synthèse des projets":"Synthèse du projet");
      const t=synth.reduce((a,x)=>{ Object.keys(a).forEach(k=>a[k]+=x[6][k]); return a; },{ht:0,ttc:0,recu:0,reste:0,com:0});
      table(["Projet","Total HT","Total TTC","Encaissé","Reste dû","Commission"], synth.map(x=>x.slice(0,6)),
        {foot: synth.length>1?["Cumul",peur(t.ht),peur(t.ttc),peur(t.recu),peur(t.reste),peur(t.com)]:undefined,
         right:[1,2,3,4,5]});
      text("Le tableau de marge (coûts d’achat, marge par projet et cumulée) viendra compléter cette synthèse.",M,{size:8.5,color:grey});
    }
  }
  // Pied de page
  const n=pdf.getNumberOfPages();
  for(let i=1;i<=n;i++){ pdf.setPage(i); pdf.setFont("helvetica","normal"); pdf.setFontSize(8); pdf.setTextColor(...grey);
    pdf.text(PT(`${STLS.nom} – ${nomFiche(c)||"Client"}${interne?" – document interne confidentiel":""}`), M, 290);
    pdf.text(`Page ${i} / ${n}`, W-M, 290, {align:"right"}); }
  return pdf;
}
const pdfName=(c,v)=>`Fiche-${slug(nomFiche(c)||c.raisonSociale||"client")}-${v==="interne"?"interne":"client"}.pdf`;

const pdfDlg=$("#pdfDlg");
function openPdf(c){
  const ps=projList(c);
  $("#pdf-projs").innerHTML = ps.length ? ps.map(p=>`<label class="toggle" style="margin:0 0 4px"><input type="checkbox" value="${p.id}" checked> ${esc(projLabel(c,p))}</label>`).join("")
    : `<p class="muted">Aucun projet : seule la partie client sera exportée.</p>`;
  document.querySelector('input[name="pdf-v"][value="client"]').checked=true;
  $("#pdf-share").hidden = !(navigator.canShare && navigator.canShare({files:[new File([""],"t.pdf",{type:"application/pdf"})]}));
  $("#pdf-err").textContent="";
  pdfDlg.showModal();
}
async function makePdf(){
  const c=current(); if(!c) return null;
  const v=document.querySelector('input[name="pdf-v"]:checked').value;
  const pids=[...document.querySelectorAll("#pdf-projs input:checked")].map(i=>i.value);
  $("#pdf-err").textContent="Préparation du PDF…";
  try{ await loadPdfLib(); }catch(e){ $("#pdf-err").textContent="Impossible de charger le module PDF : vérifiez la connexion internet."; return null; }
  try{ const pdf=buildPdf(c,v,pids); $("#pdf-err").textContent=""; return {pdf, name:pdfName(c,v), v}; }
  catch(e){ console.error(e); $("#pdf-err").textContent="Erreur pendant la création du PDF."; return null; }
}
$("#pdf-cancel").addEventListener("click", ()=>pdfDlg.close());
$("#pdf-dl").addEventListener("click", async ()=>{ const r=await makePdf(); if(!r) return; r.pdf.save(r.name); pdfDlg.close(); toast(`${r.name} téléchargé`); });
$("#pdf-share").addEventListener("click", async ()=>{
  const r=await makePdf(); if(!r) return;
  const file=new File([r.pdf.output("blob")], r.name, {type:"application/pdf"});
  try{ await navigator.share({files:[file], title:r.name}); pdfDlg.close();
    const c=current(); if(c) logSuivi(c,"","g",`Fiche PDF ${r.v==="interne"?"interne":"client"} partagée.`,"Email"); }
  catch(e){ if(e?.name!=="AbortError") $("#pdf-err").textContent="Partage impossible sur cet appareil : utilisez « Télécharger »."; }
});
/* ---------- Événements : paramètres ---------- */
function paramInput(el){
  if(el.dataset.ptype!==undefined){
    const t=P.types[+el.dataset.ptype];
    if(el.dataset.k==="visite"){ return; }
    if(el.dataset.k==="nom") t.nom=el.value.trim();
    else t.rubriques=el.value.split(",").map(s=>s.trim()).filter(Boolean);
    saveParams(); return;
  }
  if(el.dataset.pparrain!==undefined){
    const p=P.parrains[+el.dataset.pparrain];
    if(el.dataset.k==="nom") p.nom=el.value.trim(); else p.pct=num(el.value);
    saveParams(); return;
  }
  if(el.dataset.pp && el.type==="number"){ P[el.dataset.pp]=num(el.value)??0; saveParams(); }
}
function paramChange(el){
  if(el.dataset.ptype!==undefined && el.dataset.k==="visite"){ P.types[+el.dataset.ptype].visite=el.checked; saveParams(true); return; }
  if(el.dataset.pp==="tvaDefaut"){ P.tvaDefaut=num(el.value); saveParams(true); rerenderKeep(); return; }
  if(el.dataset.pp){ refreshAfter(el); }
}
function paramClick(t){
  const add=t.closest("[data-padd]");
  if(add){
    const k=add.dataset.padd;
    if(k==="tvaRates"){ const v=num((prompt("Nouveau taux de TVA (%) :")||"").replace(",",".")); if(v!=null && !P.tvaRates.includes(v)){ P.tvaRates.push(v); P.tvaRates.sort((a,b)=>a-b); } }
    else if(k==="types"){ const v=(prompt("Nom du type de projet :")||"").trim(); if(v) P.types.push({nom:v,rubriques:["Description"]}); }
    else if(k==="parrains"){ const v=(prompt("Nom du parrain :")||"").trim(); if(v) P.parrains.push({nom:v,pct:num((prompt("Commission par défaut (%) :")||"").replace(",","."))}); }
    else { const v=(prompt(k==="biens"?"Nouveau type de bien :":"Nom du poseur :")||"").trim(); if(v && !P[k].includes(v)) P[k].push(v); }
    saveParams(true); rerenderKeep(); return;
  }
  const del=t.closest("[data-pdel]");
  if(del){
    const k=del.dataset.pdel, i=+del.dataset.i;
    const label = k==="types"?P.types[i].nom : k==="parrains"?P.parrains[i].nom : P[k][i];
    if(k==="tvaRates" && P.tvaRates.length<=1){ toast("Gardez au moins un taux."); return; }
    if(!confirm(`Retirer « ${label}${k==="tvaRates"?" %":""} » de la liste ? Les fiches existantes ne sont pas modifiées.`)) return;
    P[k].splice(i,1);
    if(k==="tvaRates" && !P.tvaRates.includes(P.tvaDefaut)) P.tvaDefaut=P.tvaRates[0];
    saveParams(true); rerenderKeep();
  }
}

/* ---------- Connexion ---------- */
const errMsg = code => ({
  "auth/invalid-credential":"Email ou mot de passe incorrect.","auth/wrong-password":"Email ou mot de passe incorrect.",
  "auth/user-not-found":"Aucun compte avec cet email.","auth/invalid-email":"Adresse email invalide.",
  "auth/too-many-requests":"Trop d’essais. Réessayez dans quelques minutes.","auth/network-request-failed":"Pas de connexion internet.",
  "auth/unauthorized-domain":"Ce site n’est pas autorisé dans Firebase (Authentication › Paramètres › Domaines autorisés)."
}[code] || "Connexion impossible.");
async function doLogin(){
  $("#lg-err").textContent="";
  try{ await signInWithEmailAndPassword(auth, $("#lg-email").value.trim(), $("#lg-pass").value); }
  catch(e){ $("#lg-err").textContent=errMsg(e.code); }
}
$("#lg-btn").addEventListener("click", doLogin);
$("#lg-pass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
$("#lg-reset").addEventListener("click", async ()=>{
  const em=$("#lg-email").value.trim();
  if(!em){ $("#lg-err").textContent="Saisissez votre email, puis cliquez sur « Mot de passe oublié »."; return; }
  try{ await sendPasswordResetEmail(auth, em); $("#lg-err").textContent="Un email de réinitialisation vient d’être envoyé."; }
  catch(e){ $("#lg-err").textContent=errMsg(e.code); }
});
$("#logoutBtn").addEventListener("click", ()=>{ flushPending(); signOut(auth); });

onAuthStateChanged(auth, user=>{
  me=user;
  if(unsub){ unsub(); unsub=null; } if(unsubP){ unsubP(); unsubP=null; }
  if(!user){ clients=[]; selId=null; selProj=null; $("#login").hidden=false; $("#app").hidden=true; setTimeout(()=>$("#lg-email").focus(),0); return; }
  $("#login").hidden=true; $("#app").hidden=false; $("#whoEmail").textContent=user.email;
  renderMain();
  unsubP = onSnapshot(doc(db,PARAMS_COL,"config"), snap=>{
    paramsExist=snap.exists();
    P = {...structuredClone(DEFAULT_PARAMS), ...(snap.exists()?snap.data():{})};
    const a=document.activeElement, typing=a && $("#main").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
    renderList(); if(!typing && !dlg.open) rerenderKeep();
  }, err=>{ console.error(err); if(err.code==="permission-denied") toast("Paramètres inaccessibles : ajoutez la règle « fichesSuiviParams ».",6000); });
  unsub = onSnapshot(collection(db,COLLECTION), snap=>{
    const a=document.activeElement;
    const typing = a && $("#main").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
    const local=current();
    const keepLocal = local && (typing || saveTimer!==null);
    clients = snap.docs.map(d=> (keepLocal && d.id===local.id) ? local : normalize({id:d.id, ...d.data()}));
    // enregistre une seule fois la conversion des anciennes fiches au format « plusieurs projets »
    clients.filter(c=>c._migrate).forEach(c=>{ delete c._migrate;
      updateFields(c.id,{projets:JSON.parse(JSON.stringify(c.projets)), suivis:JSON.parse(JSON.stringify(c.suivis))}); });
    if(selId && selId!=="__params" && !clients.some(c=>c.id===selId)) selId=null;
    renderList();
    if(!typing && !dlg.open){ const top=$("#main").scrollTop; renderMain(); $("#main").scrollTop=top; }
  }, err=>{ console.error(err); toast(err.code==="permission-denied" ? "Accès refusé : vérifiez les règles Firestore." : "Connexion aux fiches perdue. Rechargez la page."); });
});
